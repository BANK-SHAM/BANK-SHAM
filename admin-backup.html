<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة BANK SHAM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07131f;
            color: white;
        }

        .header {
            padding: 22px;
            background: #0b1928;
            border-bottom: 1px solid rgba(25,211,174,.2);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: #19d3ae;
        }

        .header p {
            color: #8192a6;
            margin: 8px 0 0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 13px 18px;
            font-weight: 900;
            cursor: pointer;
        }

        .refresh {
            background: #19d3ae;
            color: #07131f;
        }

        .logout {
            background: #18293a;
            color: white;
        }

        #message {
            text-align: center;
            color: #8192a6;
            margin: 20px 0;
        }

        .request {
            background: #0b1928;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .request h3 {
            margin: 0 0 12px;
            color: #19d3ae;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }

        .label {
            color: #8192a6;
        }

        .value {
            font-weight: 800;
            word-break: break-all;
        }

        .proof {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-top: 14px;
            border-radius: 14px;
            background: #101f30;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .approve {
            flex: 1;
            background: #19d3ae;
            color: #07131f;
        }

        .reject {
            flex: 1;
            background: #c0392b;
            color: white;
        }

        .status {
            margin-top: 12px;
            text-align: center;
            padding: 9px;
            border-radius: 10px;
            background: rgba(255,255,255,.05);
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🏦 BANK SHAM</h1>
    <p>لوحة إدارة طلبات الإيداع</p>
</div>

<div class="container">

    <div class="toolbar">
        <button class="refresh" onclick="loadRequests()">
            🔄 تحديث الطلبات
        </button>

        <button class="logout" onclick="logout()">
            تسجيل الخروج
        </button>
    </div>

    <div id="message">
        ⏳ جارٍ تحميل الطلبات...
    </div>

    <div id="requests"></div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    connectAuthEmulator,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFunctions,
    connectFunctionsEmulator,
    httpsCallable
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";


const firebaseConfig = {
    apiKey: "fake-api-key",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:000000000000"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const functions = getFunctions(app);


if (
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1"
) {
    connectAuthEmulator(
        auth,
        "http://127.0.0.1:9099",
        { disableWarnings: true }
    );

    connectFunctionsEmulator(
        functions,
        "127.0.0.1",
        5001
    );
}


const listRequests =
    httpsCallable(
        functions,
        "listShamCashDepositRequests"
    );

const approveRequest =
    httpsCallable(
        functions,
        "approveShamCashDeposit"
    );

const rejectRequest =
    httpsCallable(
        functions,
        "rejectShamCashDeposit"
    );


const message =
    document.getElementById("message");

const requestsBox =
    document.getElementById("requests");


window.loadRequests = loadRequests;
window.logout = logout;


onAuthStateChanged(auth, async (user) => {

    if (!user) {
        message.textContent =
            "❌ يجب تسجيل الدخول بحساب المدير.";

        return;
    }

    await loadRequests();
});


async function loadRequests() {

    const user = auth.currentUser;

    if (!user) {
        message.textContent =
            "❌ لم يتم تسجيل الدخول.";

        return;
    }

    message.textContent =
        "⏳ جارٍ تحميل الطلبات...";

    try {

        const result =
            await listRequests();

        const list =
            result.data?.requests || [];

        requestsBox.innerHTML = "";

        if (!list.length) {

            message.textContent =
                "لا توجد طلبات إيداع حاليًا.";

            return;
        }

        message.textContent =
            `تم العثور على ${list.length} طلب.`;

        list.forEach(renderRequest);

    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ " +
            (
                error.message ||
                "تعذر تحميل الطلبات."
            );
    }
}


function renderRequest(request) {

    const card =
        document.createElement("div");

    card.className = "request";

    const date =
        request.createdAt
            ? new Date(
                request.createdAt
            ).toLocaleString("ar-SA")
            : "غير متوفر";

    const statusText =
        request.status === "pending"
            ? "⏳ قيد المراجعة"
            : request.status === "approved"
                ? "✅ تمت الموافقة"
                : "❌ مرفوض";


    card.innerHTML = `

        <h3>
            💚 طلب إيداع شام كاش
        </h3>

        <div class="row">
            <span class="label">رقم العملية</span>
            <span class="value">
                ${request.operationNumber || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">رقم الحساب</span>
            <span class="value">
                ${request.accountNumber || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">المبلغ</span>
            <span class="value">
                ${Number(request.amount || 0).toLocaleString()}
                ${request.currency || "USD"}
            </span>
        </div>

        <div class="row">
            <span class="label">التاريخ</span>
            <span class="value">
                ${date}
            </span>
        </div>

        ${
            request.proofImage
            ? `
                <img
                    class="proof"
                    src="${request.proofImage}"
                    alt="إشعار تحويل شام كاش"
                >
            `
            : ""
        }

        <div class="status">
            ${statusText}
        </div>

        ${
            request.status === "pending"
            ? `
                <div class="actions">

                    <button
                        class="approve"
                        onclick="approve('${request.id}')"
                    >
                        ✅ موافقة
                    </button>

                    <button
                        class="reject"
                        onclick="reject('${request.id}')"
                    >
                        ❌ رفض
                    </button>

                </div>
            `
            : ""
        }
    `;

    requestsBox.appendChild(card);
}


window.approve = async function(id) {

    if (
        !confirm(
            "هل تريد الموافقة على هذا الطلب وإضافة المبلغ إلى رصيد المستخدم؟"
        )
    ) {
        return;
    }

    try {

        await approveRequest({
            requestId: id
        });

        alert("✅ تمت الموافقة وإضافة الرصيد.");

        await loadRequests();

    } catch (error) {

        console.error(error);

        alert(
            "❌ فشلت الموافقة: " +
            (
                error.message ||
                "خطأ غير معروف"
            )
        );
    }
};


window.reject = async function(id) {

    if (
        !confirm(
            "هل تريد رفض هذا الطلب؟ لن يتم إضافة أي مبلغ."
        )
    ) {
        return;
    }

    try {

        await rejectRequest({
            requestId: id
        });

        alert("❌ تم رفض الطلب.");

        await loadRequests();

    } catch (error) {

        console.error(error);

        alert(
            "❌ فشل الرفض: " +
            (
                error.message ||
                "خطأ غير معروف"
            )
        );
    }
};


async function logout() {

    await signOut(auth);

    location.href = "login.html";
}

</script>

</body>
</html>
