<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملف الشخصي - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.header-title {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 20px;
  text-align: center;
}

.profile-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 24px;
  border-radius: 24px;
  backdrop-filter: blur(10px);
  text-align: center;
  margin-bottom: 20px;
}

.profile-avatar {
  width: 75px;
  height: 75px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: #fff;
  margin: 0 auto 15px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4);
}

.profile-name {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 5px;
}

.profile-account {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.info-list {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
}

.info-item {
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--card-border);
  font-size: 14px;
}

.info-item:last-child {
  border-bottom: none;
}

.info-label {
  color: var(--text-muted);
}

.info-val {
  font-weight: 700;
}

.btn-logout {
  width: 100%;
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.3);
  color: var(--error);
  padding: 15px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.btn-logout:hover {
  background: rgba(248, 113, 113, 0.2);
}

/* ================= شريط التنقل السفلي ================= */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4); cursor: pointer; margin-top: -15px;
}
</style>
<script>
  // نظام الحماية
  if (localStorage.getItem('bankShamAuth') !== 'true') {
    alert('يرجى تسجيل الدخول أولاً');
    location.href = 'index.html';
  }
</script>
</head>
<body>

<div class="page">
  <div class="header-title">الملف الشخصي</div>

  <div class="profile-card">
    <div class="profile-avatar">👤</div>
    <div class="profile-name" id="profileName">اسم المستخدم</div>
    <div class="profile-account" id="profileAccountNum">رقم الحساب: ---</div>
  </div>

  <div class="info-list">
    <div class="info-item">
      <span class="info-label">حالة الحساب</span>
      <span class="info-val" style="color: #34d399;">نشط وموثق</span>
    </div>
    <div class="info-item">
      <span class="info-label">العملة الأساسية</span>
      <span class="info-val">USD ($)</span>
    </div>
    <div class="info-item">
      <span class="info-label">نوع الحساب</span>
      <span class="info-val">حساب أفراد رقمي</span>
    </div>
  </div>

  <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="location.href='profile.html'">
    <span>👤</span> الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span> البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'" title="رمز QR">
    📷
  </button>
  <button class="nav-item" onclick="location.href='transfer.html'">
    <span>💱</span> العمليات
  </button>
  <button class="nav-item" onclick="location.href='dashboard.html'">
    <span>🏠</span> الرئيسية
  </button>
</nav>

<script>
window.onload = function() {
  const name = localStorage.getItem('bankShamUser') || 'المستخدم';
  const account = localStorage.getItem('bankShamAccount') || 'غير معروف';

  document.getElementById('profileName').textContent = name;
  document.getElementById('profileAccountNum').textContent = 'رقم الحساب: ' + account;
};

function logout() {
  if(confirm('هل أنت متأكد من رغبتك في تسجيل الخروج؟')) {
    localStorage.removeItem('bankShamAuth'); // إزالة حالة المصادقة فقط للحفاظ على بيانات الحساب عند العودة
    location.href = 'index.html';
  }
}
</script>

</body>
</html>
