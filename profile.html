<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملف الشخصي - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.title {
  font-size: 18px;
  font-weight: 900;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.profile-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 24px;
  border-radius: 24px;
  backdrop-filter: blur(10px);
  text-align: center;
  margin-bottom: 20px;
}

.avatar-circle {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 12px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4);
}

.profile-name {
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 4px;
}

.profile-acc {
  font-size: 12px;
  color: var(--accent-color);
  font-weight: bold;
}

.info-section {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 16px;
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;
}

.info-row:last-child {
  border-bottom: none;
}

.info-label {
  color: var(--text-muted);
  font-weight: 700;
}

.info-val {
  font-weight: 800;
}

.logout-btn {
  width: 100%;
  background: rgba(248, 113, 113, 0.15);
  border: 1px solid rgba(248, 113, 113, 0.3);
  color: var(--error);
  padding: 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; margin-top: -15px;
}
</style>

<!-- استيراد مكتبات Firebase وجلب بيانات الملف الشخصي -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadProfileData() {
    if (localStorage.getItem('bankShamAuth') !== 'true') {
      alert('يرجى تسجيل الدخول أولاً');
      location.href = 'index.html';
      return;
    }

    const currentAcc = localStorage.getItem('bankShamAccount');
    if (!currentAcc) {
      location.href = 'index.html';
      return;
    }

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      let foundUser = null;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        if (docId === currentAcc || data.accountNumber === currentAcc || data.account === currentAcc) {
          foundUser = data;
        }
      });

      if (foundUser) {
        document.getElementById('profileName').textContent = foundUser.name || foundUser.fullName || 'المستخدم';
        document.getElementById('profileAcc').textContent = 'رقم الحساب: ' + currentAcc;
        document.getElementById('valName').textContent = foundUser.name || foundUser.fullName || '-';
        document.getElementById('valAcc').textContent = currentAcc;
        document.getElementById('valEmail').textContent = foundUser.email || 'غير متوفر';
        document.getElementById('valPhone').textContent = foundUser.phone || 'غير متوفر';
      }
    } catch (err) {
      console.error(err);
    }
  }

  window.logout = function() {
    localStorage.removeItem('bankShamAuth');
    localStorage.removeItem('bankShamAccount');
    localStorage.removeItem('bankShamBalance');
    localStorage.removeItem('bankShamUser');
    location.href = 'index.html';
  };

  window.addEventListener('DOMContentLoaded', loadProfileData);
</script>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">الملف الشخصي</div>
    <button class="back-btn" onclick="location.href='dashboard.html'">الرئيسية</button>
  </div>

  <div class="profile-card">
    <div class="avatar-circle">👤</div>
    <div class="profile-name" id="profileName">جاري التحميل...</div>
    <div class="profile-acc" id="profileAcc"></div>
  </div>

  <div class="info-section">
    <div class="info-row">
      <span class="info-label">الاسم الكامل</span>
      <span class="info-val" id="valName">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">رقم الحساب</span>
      <span class="info-val" id="valAcc">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">البريد الإلكتروني</span>
      <span class="info-val" id="valEmail">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">رقم الهاتف</span>
      <span class="info-val" id="valPhone">-</span>
    </div>
  </div>

  <button class="logout-btn" onclick="logout()">تسجيل الخروج من الحساب</button>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="location.href='profile.html'">
    <span>👤</span> الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span> البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'" title="رمز QR">
    📷
  </button>
  <button class="nav-item" onclick="location.href='transfer.html'">
    <span>💱</span> العمليات
  </button>
  <button class="nav-item" onclick="location.href='dashboard.html'">
    <span>🏠</span> الرئيسية
  </button>
</nav>

</body>
</html>
