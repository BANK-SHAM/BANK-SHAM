<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملف الشخصي - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: all 0.2s ease;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= رأس الملف الشخصي ================= */
.profile-header {
  text-align: center;
  margin-bottom: 24px;
}

.profile-avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(82, 120, 220, 0.2);
  border: 2px solid var(--accent-color);
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.profile-name {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 6px;
}

.profile-acc-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 6px 14px;
  border-radius: 12px;
  font-size: 13px;
  color: var(--text-muted);
}

.profile-acc-box span {
  color: #fff;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.copy-btn {
  background: none;
  border: none;
  color: var(--accent-color);
  cursor: pointer;
  font-size: 14px;
  padding: 0;
}

/* ================= قائمة الخيارات (القائمة المنسدلة) ================= */
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.menu-item {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 14px 16px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  backdrop-filter: blur(10px);
  color: var(--text-main);
  text-decoration: none;
}

.menu-item:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.15);
}

.menu-item-right {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 700;
}

.menu-item-icon {
  font-size: 18px;
  color: var(--accent-color);
}

.menu-item-left {
  color: var(--text-muted);
  font-size: 14px;
}

/* ================= شريط التنقل السفلي الثابت ================= */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(13, 27, 48, 0.95);
  backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border);
  padding: 10px 16px 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
}

.nav-item {
  background: none;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  cursor: pointer;
  text-decoration: none;
}

.nav-item.active {
  color: var(--accent-color);
  font-weight: 700;
}

.nav-item span {
  font-size: 18px;
}

.nav-qr-btn {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4);
  cursor: pointer;
  margin-top: -15px;
}
</style>
</head>
<body>

<div class="page">
  <!-- رأس الملف الشخصي -->
  <div class="profile-header">
    <div class="profile-avatar">👤</div>
    <div class="profile-name">مصطفى خالد شبيب</div>
    <div class="profile-acc-box">
      <button class="copy-btn" onclick="copyAccountNum()" title="نسخ الرقم">📋</button>
      <span id="accNum">7105 4222 3520 5373</span>
    </div>
  </div>

  <!-- قائمة الخيارات المصرفية -->
  <div class="menu-list">
    <a href="#" class="menu-item" onclick="alert('الحساب موثق بنجاح')">
      <div class="menu-item-right">
        <span class="menu-item-icon">🛡️</span>
        <span>توثيق الحساب</span>
      </div>
      <div class="menu-item-left">✓</div>
    </a>

    <a href="account-info.html" class="menu-item">
      <div class="menu-item-right">
        <span class="menu-item-icon">👤</span>
        <span>معلومات الحساب</span>
      </div>
      <div class="menu-item-left">›</div>
    </a>

    <a href="#" class="menu-item" onclick="alert('إعدادات التحويل')">
      <div class="menu-item-right">
        <span class="menu-item-icon">🔄</span>
        <span>إعدادات التحويل</span>
      </div>
      <div class="menu-item-left">›</div>
    </a>

    <a href="#" class="menu-item" onclick="alert('إعدادات الأمان')">
      <div class="menu-item-right">
        <span class="menu-item-icon">🔒</span>
        <span>إعدادات الأمان</span>
      </div>
      <div class="menu-item-left">›</div>
    </a>

    <a href="#" class="menu-item" onclick="alert('الأجهزة المرتبطة بالحساب')">
      <div class="menu-item-right">
        <span class="menu-item-icon">📱</span>
        <span>الأجهزة المرتبطة</span>
      </div>
      <div class="menu-item-left">›</div>
    </a>

    <a href="#" class="menu-item" onclick="alert('اللغة العربية')">
      <div class="menu-item-right">
        <span class="menu-item-icon">🌐</span>
        <span>اللغة</span>
      </div>
      <div class="menu-item-left">العربية ›</div>
    </a>

    <div class="menu-item">
      <div class="menu-item-right">
        <span class="menu-item-icon">🌙</span>
        <span>الثيم</span>
      </div>
      <div class="menu-item-left">داكن</div>
    </div>
  </div>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="location.href='profile.html'">
    <span>👤</span>
    الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span>
    البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'">
    📷
  </button>
  <button class="nav-item" onclick="location.href='transfer.html'">
    <span>💱</span>
    العمليات
  </button>
  <button class="nav-item" onclick="location.href='dashboard.html'">
    <span>🏠</span>
    الرئيسية
  </button>
</nav>

<script>
function copyAccountNum() {
  const text = document.getElementById('accNum').innerText;
  navigator.clipboard.writeText(text);
  alert('تم نسخ رقم الحساب بنجاح: ' + text);
}
</script>

</body>
</html>
