<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إرسال حوالة - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.header-title {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 20px;
  text-align: center;
}

.card-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 24px;
  border-radius: 24px;
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
  text-align: right;
}

.form-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: block;
}

.form-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--card-border);
  padding: 14px;
  border-radius: 14px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.form-input:focus {
  border-color: var(--accent-color);
}

.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  padding: 15px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 6px 20px rgba(82, 120, 220, 0.3);
}

.btn-primary:hover {
  filter: brightness(1.05);
}

.balance-hint {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 15px;
}

/* ================= شريط التنقل السفلي ================= */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4); cursor: pointer; margin-top: -15px;
}
</style>
<script>
  // نظام الحماية
  if (localStorage.getItem('bankShamAuth') !== 'true') {
    alert('يرجى تسجيل الدخول أولاً');
    location.href = 'index.html';
  }
</script>
</head>
<body>

<div class="page">
  <div class="header-title">إرسال حوالة مالية</div>

  <div class="balance-hint">
    الرصيد المتاح حالياً: <span id="currentBalanceVal" style="color: #34d399; font-weight: bold;">0.00</span> USD
  </div>

  <div class="card-box">
    <form onsubmit="handleTransfer(event)">
      <div class="form-group">
        <label class="form-label">رقم حساب المستلم أو البريد</label>
        <input type="text" id="recipientAccount" class="form-input" placeholder="أدخل حساب المستلم" required>
      </div>

      <div class="form-group">
        <label class="form-label">المبلغ المراد إرساله (USD)</label>
        <input type="number" id="transferAmount" class="form-input" placeholder="0.00" min="1" step="any" required>
      </div>

      <div class="form-group">
        <label class="form-label">ملاحظات التحويل (اختياري)</label>
        <input type="text" id="transferNote" class="form-input" placeholder="سبب التحويل">
      </div>

      <button type="submit" class="btn-primary">تنفيذ وإرسال الحوالة</button>
    </form>
  </div>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='profile.html'">
    <span>👤</span> الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span> البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'" title="رمز QR">
    📷
  </button>
  <button class="nav-item active" onclick="location.href='transfer.html'">
    <span>💱</span> العمليات
  </button>
  <button class="nav-item" onclick="location.href='dashboard.html'">
    <span>🏠</span> الرئيسية
  </button>
</nav>

<script>
window.onload = function() {
  syncCurrentAccountData();
  const balance = localStorage.getItem('bankShamBalance') || '0.00';
  document.getElementById('currentBalanceVal').textContent = balance;
};

// ضمان مزامنة وتخزين الحساب الحالي في قاعدة بيانات المستخدمين المشتركة
function syncCurrentAccountData() {
  let users = JSON.parse(localStorage.getItem('bankShamAllUsers') || '[]');
  const currentAcc = localStorage.getItem('bankShamAccount');
  const currentUser = localStorage.getItem('bankShamUser');
  const currentBal = parseFloat(localStorage.getItem('bankShamBalance') || '0.00');

  if (!currentAcc) return;

  let existingUserIndex = users.findIndex(u => u.account === currentAcc);
  if (existingUserIndex !== -1) {
    users[existingUserIndex].balance = currentBal;
    users[existingUserIndex].name = currentUser;
  } else {
    users.push({
      account: currentAcc,
      name: currentUser,
      balance: currentBal
    });
  }
  localStorage.setItem('bankShamAllUsers', JSON.stringify(users));
}

function handleTransfer(e) {
  e.preventDefault();
  const recipientInput = document.getElementById('recipientAccount').value.trim();
  const amountStr = document.getElementById('transferAmount').value;
  const amount = parseFloat(amountStr);
  
  const senderAccount = localStorage.getItem('bankShamAccount');
  let currentBalance = parseFloat(localStorage.getItem('bankShamBalance') || '0.00');

  if(amount <= 0) {
    alert('يرجى إدخال مبلغ صحيح.');
    return;
  }

  if(recipientInput === senderAccount) {
    alert('لا يمكنك إرسال حوالة إلى نفس حسابك الشخصي!');
    return;
  }

  if(amount > currentBalance) {
    alert('فشلت العملية: رصيدك الحالي غير كافٍ لإتمام الحوالة. (رصيدك: $' + currentBalance + ').');
    return;
  }

  // جلب قائمة كافة الحسابات المشتركة
  let users = JSON.parse(localStorage.getItem('bankShamAllUsers') || '[]');
  
  // البحث عن حساب المستلم (برقم الحساب أو اسم المستخدم)
  let recipientUser = users.find(u => u.account === recipientInput || u.name === recipientInput);

  if(!recipientUser) {
    alert('خطأ: حساب المستلم غير موجود في النظام!');
    return;
  }

  // 1. خصم المبلغ من رصيد المرسل
  currentBalance -= amount;
  localStorage.setItem('bankShamBalance', currentBalance.toFixed(2));

  // 2. إضافة المبلغ إلى رصيد المستلم في قاعدة البيانات المشتركة
  recipientUser.balance = parseFloat(recipientUser.balance || 0) + amount;

  // إذا كان المستلم هو نفس الحساب الحالي المسجل على المتصفح (في حال تجربة متصفحين) نحدثه مباشرة
  if(localStorage.getItem('bankShamAccount') === recipientUser.account) {
    localStorage.setItem('bankShamBalance', recipientUser.balance.toFixed(2));
  }

  // تحديث قاعدة بيانات المستخدمين العامة
  localStorage.setItem('bankShamAllUsers', JSON.stringify(users));

  // تحديث رصيد المرسل أيضاً في المصفوفة العامة
  syncCurrentAccountData();

  alert('تمت عملية التحويل بنجاح إلى المستلم: ' + recipientUser.name + ' بمبلغ $' + amount);
  location.href = 'dashboard.html';
}
</script>

</body>
</html>
