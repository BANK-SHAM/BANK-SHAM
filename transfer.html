<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحويل الأموال - BANK SHAM</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  color:#fff;
  background:linear-gradient(135deg,#07111f,#10243b)
}

.card{
  width:100%;
  max-width:430px;
  padding:28px 22px;
  border-radius:24px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 50px rgba(0,0,0,.35)
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold
}

.subtitle{
  text-align:center;
  color:#aab8c8;
  margin:8px 0 25px
}

label{
  display:block;
  margin:16px 0 8px
}

input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.25);
  color:#fff;
  font-size:16px;
  outline:0
}

button{
  width:100%;
  margin-top:24px;
  padding:16px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#1479ff,#00b7ff);
  color:#fff;
  font-size:17px;
  font-weight:bold
}

button:disabled{
  opacity:.6
}

#message{
  margin-top:18px;
  text-align:center;
  line-height:1.7;
  min-height:30px
}

.success{
  color:#5cff9d
}

.error{
  color:#ff7373
}

hr{
  margin:28px 0;
  border:0;
  border-top:1px solid rgba(255,255,255,.15)
}

h3{
  text-align:center;
  margin-bottom:18px
}

.transaction{
  padding:15px;
  margin-bottom:12px;
  border-radius:15px;
  background:rgba(0,0,0,.22);
  line-height:1.9;
  border:1px solid rgba(255,255,255,.08)
}

.transaction.outgoing{
  border-right:4px solid #ff7373
}

.transaction.incoming{
  border-right:4px solid #5cff9d
}

.transaction-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:6px
}

.transaction-row{
  font-size:14px;
  color:#d8e1eb
}

.transaction-id{
  font-size:11px;
  color:#8d9aaa;
  word-break:break-all;
  margin-top:6px
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#8ec8ff;
  text-decoration:none
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🏦 BANK SHAM</div>

<div class="subtitle">تحويل داخلي</div>

<form id="transferForm">

<label>رقم حساب المستلم</label>

<input
  id="receiverAccount"
  type="text"
  placeholder="مثال: 100002"
  required
>

<label>المبلغ</label>

<input
  id="amount"
  type="number"
  placeholder="250"
  min="0.01"
  step="0.01"
  required
>

<label>ملاحظة</label>

<input
  id="note"
  type="text"
  placeholder="سبب التحويل"
  maxlength="100"
>

<button id="transferBtn" type="submit">
تحويل الأموال
</button>

</form>

<div id="message">
جاري التحقق من تسجيل الدخول...
</div>

<hr>

<h3>📋 سجل العمليات</h3>

<div id="transactionsList">
جاري تحميل العمليات...
</div>

<a class="back" href="dashboard.html">
← العودة إلى الحساب
</a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",

  authDomain:
    "ahmad-662ee.firebaseapp.com",

  projectId:
    "ahmad-662ee",

  storageBucket:
    "ahmad-662ee.firebasestorage.app",

  messagingSenderId:
    "740891153734",

  appId:
    "1:740891153734:web:80d3fd406214929c618147"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const form =
  document.getElementById("transferForm");

const button =
  document.getElementById("transferBtn");

const message =
  document.getElementById("message");

const transactionsList =
  document.getElementById("transactionsList");


const WORKER_URL =
  "https://bank-sham-transfer.ahmadkald12324.workers.dev";


/* =========================
   سجل العمليات
========================= */

async function loadTransactions(user){

  transactionsList.innerHTML =
    "جاري تحميل العمليات...";

  try{

    /*
      الحصول على رقم حساب المستخدم
    */

    const userDoc =
      await getDoc(
        doc(db,"users",user.uid)
      );

    if(!userDoc.exists()){

      transactionsList.innerHTML =
        "تعذر العثور على بيانات الحساب.";

      return;
    }


    const userData =
      userDoc.data();

    const accountNumber =
      String(
        userData.accountNumber || ""
      ).trim();


    if(!accountNumber){

      transactionsList.innerHTML =
        "رقم الحساب غير موجود.";

      return;
    }


    /*
      العمليات الصادرة
    */

    const outgoingQuery =
      query(
        collection(db,"transactions"),
        where(
          "senderUid",
          "==",
          user.uid
        )
      );


    /*
      العمليات الواردة
    */

    const incomingQuery =
      query(
        collection(db,"transactions"),
        where(
          "receiverAccountNumber",
          "==",
          accountNumber
        )
      );


    const [
      outgoingSnapshot,
      incomingSnapshot
    ] =
      await Promise.all([

        getDocs(outgoingQuery),

        getDocs(incomingQuery)

      ]);


    const transactions = [];

    const ids = new Set();


    /*
      إضافة الصادرة
    */

    outgoingSnapshot.forEach(
      (docSnap)=>{

        if(ids.has(docSnap.id))
          return;

        ids.add(docSnap.id);

        transactions.push({

          id:docSnap.id,

          data:docSnap.data(),

          type:"outgoing"

        });

      }
    );


    /*
      إضافة الواردة
    */

    incomingSnapshot.forEach(
      (docSnap)=>{

        if(ids.has(docSnap.id))
          return;

        ids.add(docSnap.id);

        transactions.push({

          id:docSnap.id,

          data:docSnap.data(),

          type:"incoming"

        });

      }
    );


    /*
      ترتيب العمليات من الأحدث إلى الأقدم
    */

    transactions.sort(
      (a,b)=>{

        const aDate =
          a.data.createdAt?.toDate
            ? a.data.createdAt.toDate()
            : new Date(
                a.data.createdAt || 0
              );

        const bDate =
          b.data.createdAt?.toDate
            ? b.data.createdAt.toDate()
            : new Date(
                b.data.createdAt || 0
              );

        return bDate - aDate;

      }
    );


    if(transactions.length === 0){

      transactionsList.innerHTML =
        `<div style="text-align:center;color:#aab8c8">
          لا توجد عمليات حتى الآن.
        </div>`;

      return;
    }


    transactionsList.innerHTML = "";


    /*
      عرض العمليات
    */

    transactions.forEach(
      ({id,data,type})=>{

        const item =
          document.createElement("div");


        item.className =
          "transaction " +
          (
            type === "outgoing"
              ? "outgoing"
              : "incoming"
          );


        const amount =
          data.amount ?? "-";


        const currency =
          data.currency || "";


        const otherAccount =
          type === "outgoing"

            ? (
                data.receiverAccountNumber
                || "-"
              )

            : (
                data.senderAccountNumber
                || "-"
              );


        const operation =
          type === "outgoing"

            ? "🔴 تحويل صادر"

            : "🟢 تحويل وارد";


        const dateObject =
          data.createdAt?.toDate
            ? data.createdAt.toDate()
            : (
                data.createdAt
                  ? new Date(data.createdAt)
                  : null
              );


        const date =
          dateObject &&
          !isNaN(dateObject.getTime())

            ? dateObject.toLocaleString(
                "ar-SA"
              )

            : "غير متوفر";


        let balanceAfter = "-";


        if(type === "outgoing"){

          balanceAfter =
            data.senderBalanceAfter
              ?? "-";

        }else{

          balanceAfter =
            data.receiverBalanceAfter
              ?? "-";

        }


        const transactionId =
          data.transactionId
            || id;


        item.innerHTML = `

          <div class="transaction-title">
            ${operation}
          </div>

          <div class="transaction-row">
            💰 المبلغ:
            <b>${amount} ${currency}</b>
          </div>

          <div class="transaction-row">
            🏦 الحساب الآخر:
            ${otherAccount}
          </div>

          <div class="transaction-row">
            📝 الملاحظة:
            ${data.note || "-"}
          </div>

          <div class="transaction-row">
            🕒 التاريخ:
            ${date}
          </div>

          <div class="transaction-row">
            💳 الرصيد بعد العملية:
            ${balanceAfter} ${currency}
          </div>

          <div class="transaction-id">
            🆔 رقم العملية:
            ${transactionId}
          </div>

        `;


        transactionsList.appendChild(item);

      }
    );


  }catch(error){

    console.error(
      "TRANSACTIONS ERROR:",
      error
    );

    transactionsList.innerHTML =
      `<div class="error" style="text-align:center">
        ❌ تعذر تحميل سجل العمليات.
      </div>`;

  }

}


/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    console.log(
      "AUTH:",
      user
    );


    if(user){

      message.className =
        "success";

      message.textContent =
        "تم تسجيل الدخول ✅";


      /*
        تحميل السجل بعد
        التأكد من تسجيل الدخول
      */

      await loadTransactions(user);


    }else{

      message.className =
        "error";

      message.textContent =
        "❌ يجب تسجيل الدخول أولاً.";

      transactionsList.innerHTML =
        "يجب تسجيل الدخول لعرض العمليات.";

    }

  }
);


/* =========================
   تنفيذ التحويل
========================= */

form.addEventListener(
  "submit",
  async(event)=>{

    event.preventDefault();


    const user =
      auth.currentUser;


    if(!user){

      message.className =
        "error";

      message.textContent =
        "❌ يجب تسجيل الدخول أولاً.";

      return;

    }


    const receiverAccountNumber =
      document
        .getElementById(
          "receiverAccount"
        )
        .value
        .trim();


    const amount =
      Number(
        document
          .getElementById("amount")
          .value
      );


    const note =
      document
        .getElementById("note")
        .value
        .trim();


    if(!receiverAccountNumber){

      message.className =
        "error";

      message.textContent =
        "❌ أدخل رقم حساب المستلم.";

      return;

    }


    if(
      !Number.isFinite(amount)
      ||
      amount <= 0
    ){

      message.className =
        "error";

      message.textContent =
        "❌ أدخل مبلغًا صحيحًا.";

      return;

    }


    button.disabled = true;

    button.textContent =
      "جاري تنفيذ التحويل...";


    message.className = "";

    message.textContent = "";


    try{

      /*
        الحصول على بيانات حساب المرسل
      */

      const userDoc =
        await getDoc(
          doc(db,"users",user.uid)
        );


      if(!userDoc.exists()){

        throw new Error(
          "تعذر العثور على حسابك."
        );

      }


      const userData =
        userDoc.data();


      const senderAccountNumber =
        String(
          userData.accountNumber || ""
        ).trim();


      if(!senderAccountNumber){

        throw new Error(
          "رقم حسابك غير موجود."
        );

      }


      /*
        الحصول على Firebase ID Token
      */

      const idToken =
        await user.getIdToken(true);


      /*
        إرسال التحويل إلى Worker
      */

      const response =
        await fetch(
          WORKER_URL,
          {

            method:"POST",

            headers:{

              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + idToken

            },

            body:JSON.stringify({

              senderAccountNumber:
                senderAccountNumber,

              receiverAccountNumber:
                receiverAccountNumber,

              amount:
                amount,

              note:
                note

            })

          }
        );


      let result = {};


      try{

        result =
          await response.json();

      }catch(e){

        throw new Error(
          "استجابة غير صالحة من خادم التحويل."
        );

      }


      if(!response.ok){

        throw new Error(
          result.error
          ||
          result.message
          ||
          "فشل تنفيذ التحويل."
        );

      }


      if(result.success){

        message.className =
          "success";

        message.textContent =
          "✅ تم التحويل بنجاح.";


        console.log(
          "TRANSFER SUCCESS:",
          result
        );


        /*
          تحديث سجل العمليات
        */

        await loadTransactions(user);


      }else{

        throw new Error(
          result.error
          ||
          "فشل تنفيذ التحويل."
        );

      }


    }catch(error){

      console.error(
        "TRANSFER ERROR:",
        error
      );


      message.className =
        "error";


      message.textContent =
        "❌ " +
        (
          error.message
          ||
          "حدث خطأ أثناء التحويل."
        );

    }finally{

      button.disabled =
        false;

      button.textContent =
        "تحويل الأموال";

    }

  }
);

</script>

</body>
</html>
