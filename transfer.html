<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إرسال حوالة - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: all 0.2s ease;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* معلومات المستلم */
.recipient-card {
  text-align: center;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
}

.recipient-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(82, 120, 220, 0.2);
  color: var(--accent-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin: 0 auto 10px;
}

.recipient-name {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 4px;
}

.recipient-account {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 1px;
}

/* أزرار العملات */
.currency-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.curr-btn {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  padding: 12px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}

.curr-btn.active {
  background: #5278dc;
  color: #fff;
  border-color: #5278dc;
  box-shadow: 0 4px 12px rgba(82, 120, 220, 0.3);
}

/* الحقول الإدخالية */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: block;
}

.form-input {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  border-radius: 16px;
  color: #fff;
  font-size: 15px;
  outline: none;
  backdrop-filter: blur(10px);
}

.form-input:focus {
  border-color: var(--accent-color);
  background: rgba(82, 120, 220, 0.08);
}

/* خيار إخفاء الهوية */
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
  font-size: 14px;
  cursor: pointer;
}

.checkbox-row input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent-color);
  cursor: pointer;
}

/* زر الإرسال */
.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  padding: 16px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.3);
}

.submit-btn:hover {
  filter: brightness(1.05);
}

/* شريط التنقل السفلي */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(13, 27, 48, 0.95);
  backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border);
  padding: 10px 16px 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
}

.nav-item {
  background: none;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  cursor: pointer;
  text-decoration: none;
}

.nav-item.active {
  color: var(--accent-color);
  font-weight: 700;
}

.nav-item span {
  font-size: 18px;
}

.nav-qr-btn {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4);
  cursor: pointer;
  margin-top: -15px;
}
</style>
</head>
<body>

<div class="page">
  <!-- بطاقة المستلم -->
  <div class="recipient-card">
    <div class="recipient-avatar">👤</div>
    <div class="recipient-name">مصطفى خالد شبيب</div>
    <div class="recipient-account">**** **** **** 6344</div>
  </div>

  <!-- أزرار اختيار العملة -->
  <div class="currency-tabs">
    <button class="curr-btn" onclick="selectCurr(this)">يورو</button>
    <button class="curr-btn active" onclick="selectCurr(this)">سوري</button>
    <button class="curr-btn" onclick="selectCurr(this)">دولار</button>
  </div>

  <!-- حقل المبلغ -->
  <div class="form-group">
    <label class="form-label">المبلغ المحول</label>
    <input type="number" class="form-input" placeholder="أدخل المبلغ">
  </div>

  <!-- حقل الملاحظة -->
  <div class="form-group">
    <label class="form-label">ملاحظة</label>
    <input type="text" class="form-input" placeholder="اكتب ملاحظة (اختياري)">
  </div>

  <!-- إخفاء الهوية -->
  <label class="checkbox-row">
    <input type="checkbox">
    <span>إخفاء الهوية</span>
  </label>

  <!-- زر إرسال -->
  <button class="submit-btn" onclick="confirmTransfer()">إرسال</button>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='profile.html'">
    <span>👤</span>
    الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span>
    البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'">
    📷
  </button>
  <button class="nav-item active" onclick="location.href='transfer.html'">
    <span>💱</span>
    العمليات
  </button>
  <button class="nav-item" onclick="location.href='dashboard.html'">
    <span>🏠</span>
    الرئيسية
  </button>
</nav>

<script>
function selectCurr(btn) {
  document.querySelectorAll('.curr-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function confirmTransfer() {
  alert('تم تنفيذ عملية التحويل بنجاح!');
  location.href = 'dashboard.html';
}
</script>

</body>
</html>
