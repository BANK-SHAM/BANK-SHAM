<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إرسال حوالة - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 20px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.title {
  font-size: 18px;
  font-weight: 900;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.card-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 20px;
  border-radius: 24px;
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  font-size: 12px;
  color: var(--text-muted);
  display: block;
  margin-bottom: 6px;
  font-weight: 700;
}

.form-input {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--card-border);
  padding: 14px;
  border-radius: 14px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.form-input:focus {
  border-color: var(--accent-color);
}

.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  padding: 14px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 10px 20px rgba(82, 120, 220, 0.3);
}

.info-balance {
  font-size: 12px;
  color: var(--success);
  margin-bottom: 15px;
  font-weight: bold;
}
</style>

<!-- استيراد مكتبات Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function initTransferPage() {
    if (localStorage.getItem('bankShamAuth') !== 'true') {
      alert('يرجى تسجيل الدخول أولاً');
      location.href = 'index.html';
      return;
    }

    const currentAcc = localStorage.getItem('bankShamAccount');
    if (!currentAcc) {
      location.href = 'index.html';
      return;
    }

    // جلب رصيد المرسل الحالي من السحابة للتأكد
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if (docSnap.id === currentAcc || data.accountNumber === currentAcc) {
          const balance = parseFloat(data.balance || 0);
          document.getElementById('senderBalanceText').textContent = 'الرصيد المتاح حالياً: $' + balance.toFixed(2);
          window.senderDocId = docSnap.id;
          window.senderBalance = balance;
        }
      });
    } catch (err) {
      console.error(err);
    }
  }

  window.executeTransfer = async function(e) {
    e.preventDefault();
    const recipientAcc = document.getElementById('recipientAcc').value.trim();
    const amount = parseFloat(document.getElementById('transferAmount').value);
    const notes = document.getElementById('transferNotes').value.trim();
    const currentAcc = localStorage.getItem('bankShamAccount');

    if (!recipientAcc || isNaN(amount) || amount <= 0) {
      alert('يرجى إدخال بيانات صحيحة.');
      return;
    }

    if (recipientAcc === currentAcc) {
      alert('لا يمكنك إرسال حوالة إلى نفس حسابك.');
      return;
    }

    if (amount > window.senderBalance) {
      alert('عذراً، رصيدك غير كافٍ لإتمام هذه الحوالة.');
      return;
    }

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      let recipientDocId = null;
      let recipientCurrentBalance = 0;
      let recipientFound = false;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if (docSnap.id === recipientAcc || data.accountNumber === recipientAcc) {
          recipientFound = true;
          recipientDocId = docSnap.id;
          recipientCurrentBalance = parseFloat(data.balance || 0);
        }
      });

      if (!recipientFound) {
        alert('رقم الحساب المستلم غير موجود في النظام.');
        return;
      }

      // 1. خصم المبلغ من المرسل
      const senderRef = doc(db, "users", window.senderDocId);
      const newSenderBalance = window.senderBalance - amount;
      await updateDoc(senderRef, { balance: newSenderBalance });

      // 2. إضافة المبلغ للمستلم
      const recipientRef = doc(db, "users", recipientDocId);
      const newRecipientBalance = recipientCurrentBalance + amount;
      await updateDoc(recipientRef, { balance: newRecipientBalance });

      // 3. تسجيل الحوالة في جدول العمليات (transactions)
      await addDoc(collection(db, "transactions"), {
        sender: currentAcc,
        recipient: recipientAcc,
        amount: amount,
        notes: notes || 'حوالة مالية سريعة',
        timestamp: serverTimestamp()
      });

      alert('تم إرسال الحوالة بنجاح وتحديث الأرصدة سحابياً!');
      location.href = 'dashboard.html';

    } catch (err) {
      console.error(err);
      alert('حدث خطأ أثناء تنفيذ الحوالة: ' + err.message);
    }
  };

  window.addEventListener('DOMContentLoaded', initTransferPage);
</script>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">إرسال حوالة مالية</div>
    <button class="back-btn" onclick="location.href='dashboard.html'">العودة</button>
  </div>

  <div class="card-box">
    <div id="senderBalanceText" class="info-balance">جاري جلب الرصيد...</div>
    
    <form onsubmit="executeTransfer(event)">
      <div class="form-group">
        <label class="form-label">رقم حساب المستلم</label>
        <input type="text" id="recipientAcc" class="form-input" placeholder="مثال: 1002" required>
      </div>

      <div class="form-group">
        <label class="form-label">المبلغ المراد إرساله (USD)</label>
        <input type="number" id="transferAmount" class="form-input" placeholder="0.00" min="1" step="any" required>
      </div>

      <div class="form-group">
        <label class="form-label">ملاحظات أو سبب الحوالة</label>
        <input type="text" id="transferNotes" class="form-input" placeholder="اختياري (أجور، مساعدة...)">
      </div>

      <button type="submit" class="submit-btn">تأكيد وإرسال الحوالة</button>
    </form>
  </div>
</div>

</body>
</html>
