<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحويلات والعمليات - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.title {
  font-size: 18px;
  font-weight: 900;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.card-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 20px;
  border-radius: 24px;
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

.balance-display {
  text-align: center;
  margin-bottom: 20px;
}

.balance-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.balance-val {
  font-size: 24px;
  font-weight: 900;
  color: var(--success);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-muted);
}

.form-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--card-border);
  padding: 12px 16px;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.form-input:focus {
  border-color: var(--accent-color);
}

.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  padding: 14px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.3);
}

.submit-btn:active {
  transform: scale(0.98);
}

.msg {
  text-align: center;
  font-size: 13px;
  margin-top: 12px;
  font-weight: bold;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; margin-top: -15px;
  text-decoration: none;
}
</style>

<!-- دوال جلب الرصيد وإجراء الحوالة عبر Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let senderDocId = null;
  let currentBalance = 0;

  async function initTransferPage() {
    if (localStorage.getItem('bankShamAuth') !== 'true') {
      alert('يرجى تسجيل الدخول أولاً');
      location.href = 'index.html';
      return;
    }

    const currentAcc = localStorage.getItem('bankShamAccount');
    if (!currentAcc) {
      location.href = 'index.html';
      return;
    }

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        if (docId === currentAcc || data.accountNumber === currentAcc || data.account === currentAcc) {
          senderDocId = docId;
          currentBalance = parseFloat(data.balance || 0);
        }
      });

      document.getElementById('displayBalance').textContent = currentBalance.toLocaleString() + ' ل.س';
    } catch (err) {
      console.error(err);
    }
  }

  window.executeTransfer = async function() {
    const recipientAcc = document.getElementById('recipientAcc').value.trim();
    const amountVal = parseFloat(document.getElementById('transferAmount').value);
    const msgEl = document.getElementById('transferMsg');

    msgEl.textContent = '';
    msgEl.style.color = '#fff';

    if (!recipientAcc || isNaN(amountVal) || amountVal <= 0) {
      msgEl.textContent = 'يرجى إدخال رقم حساب صحيح ومبلغ صالح.';
      msgEl.style.color = 'var(--error)';
      return;
    }

    if (amountVal > currentBalance) {
      msgEl.textContent = 'عذراً، رصيدك غير كافٍ لإتمام هذه الحوالة.';
      msgEl.style.color = 'var(--error)';
      return;
    }

    if (recipientAcc === localStorage.getItem('bankShamAccount')) {
      msgEl.textContent = 'لا يمكنك التحويل لنفس الحساب.';
      msgEl.style.color = 'var(--error)';
      return;
    }

    try {
      msgEl.textContent = 'جاري تنفيذ الحوالة...';
      
      // البحث عن المستلم في قاعدة البيانات
      const querySnapshot = await getDocs(collection(db, "users"));
      let recipientDocId = null;
      let recipientCurrentBalance = 0;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        if (docId === recipientAcc || data.accountNumber === recipientAcc || data.account === recipientAcc) {
          recipientDocId = docId;
          recipientCurrentBalance = parseFloat(data.balance || 0);
        }
      });

      if (!recipientDocId) {
        msgEl.textContent = 'رقم حساب المستلم غير موجود في النظام.';
        msgEl.style.color = 'var(--error)';
        return;
      }

      // خصم المبلغ من المرسل
      const senderRef = doc(db, "users", senderDocId);
      const newSenderBalance = currentBalance - amountVal;
      await updateDoc(senderRef, { balance: newSenderBalance });

      // إضافة المبلغ للمستلم
      const recipientRef = doc(db, "users", recipientDocId);
      const newRecipientBalance = recipientCurrentBalance + amountVal;
      await updateDoc(recipientRef, { balance: newRecipientBalance });

      // تحديث الواجهة والتخزين المحلي
      currentBalance = newSenderBalance;
      document.getElementById('displayBalance').textContent = currentBalance.toLocaleString() + ' ل.س';
      localStorage.setItem('bankShamBalance', currentBalance);

      msgEl.textContent = 'تمت الحوالة بنجاح وتم خصم المبلغ من حسابك!';
      msgEl.style.color = 'var(--success)';

      // تفريغ الحقول
      document.getElementById('recipientAcc').value = '';
      document.getElementById('transferAmount').value = '';

    } catch (err) {
      console.error(err);
      msgEl.textContent = 'حدث خطأ أثناء تنفيذ الحوالة. حاول مرة أخرى.';
      msgEl.style.color = 'var(--error)';
    }
  };

  window.addEventListener('DOMContentLoaded', initTransferPage);
</script>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">التحويلات المصرفية</div>
    <a href="dashboard.html" class="back-btn">الرئيسية</a>
  </div>

  <div class="card-box">
    <div class="balance-display">
      <div class="balance-label">الرصيد المتاح للتحويل</div>
      <div class="balance-val" id="displayBalance">0 ل.س</div>
    </div>

    <div class="form-group">
      <label class="form-label">رقم حساب المستلم</label>
      <input type="text" id="recipientAcc" class="form-input" placeholder="أدخل رقم حساب المستلم">
    </div>

    <div class="form-group">
      <label class="form-label">المبلغ المراد تحويله (ل.س)</label>
      <input type="number" id="transferAmount" class="form-input" placeholder="0.00">
    </div>

    <button class="submit-btn" onclick="executeTransfer()">إرسال الحوالة الآن</button>
    <div class="msg" id="transferMsg"></div>
  </div>
</div>

<!-- القائمة السفلية المعدلة بروابط مباشرة مضمونة -->
<nav class="bottom-nav">
  <a href="profile.html" class="nav-item">
    <span>👤</span> الملف
  </a>
  <a href="cards.html" class="nav-item">
    <span>💳</span> البطاقات
  </a>
  <a href="qr.html" class="nav-qr-btn" title="رمز QR">
    📷

  <a href="transfer.html" class="nav-item active">
    <span>💱</span> العمليات
  </a>
  <a href="dashboard.html" class="nav-item">
    <span>🏠</span> الرئيسية
  </a>
</nav>

</body>
</html>
