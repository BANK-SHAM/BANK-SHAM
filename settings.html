<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الحساب - محفظة إدلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        .page-header {
            background: #1b4332;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h2 {
            font-size: 18px;
        }
        .back-link {
            color: #d8f3dc;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* بطاقة القسم */
        .settings-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        .settings-card h3 {
            font-size: 16px;
            color: #1b4332;
            margin-bottom: 15px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2d6a4f;
        }

        .save-btn {
            background: #2d6a4f;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* خيارات الأمان وتسجيل الخروج */
        .danger-zone {
            margin-top: 20px;
        }
        .logout-link-btn {
            background: #d90429;
            color: #fff;
            text-align: center;
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header class="page-header">
        <a href="dashboard.html" class="back-link">← لوحة التحكم</a>
        <h2>إعدادات الحساب</h2>
        <div style="width: 50px;"></div>
    </header>

    <div class="container">
        
        <!-- تعديل المعلومات الشخصية -->
        <div class="settings-card">
            <h3>المعلومات الشخصية</h3>
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" value="أحمد خالد">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" value="0912345678">
            </div>
            <button class="save-btn" onclick="alert('تم حفظ التعديلات بنجاح!')">حفظ التغييرات</button>
        </div>

        <!-- الأمان وكلمة المرور -->
        <div class="settings-card">
            <h3>تغيير كلمة المرور</h3>
            <div class="form-group">
                <label>كلمة المرور الحالية</label>
                <input type="password" placeholder="********">
            </div>
            <div class="form-group">
                <label>كلمة المرور الجديدة</label>
                <input type="password" placeholder="********">
            </div>
            <button class="save-btn" onclick="alert('تم تحديث كلمة المرور بنجاح!')">تحديث كلمة المرور</button>
        </div>

        <!-- زر تسجيل الخروج -->
        <div class="danger-zone">
            <a href="auth.html" class="logout-link-btn">تسجيل الخروج من التطبيق</a>
        </div>

    </div>

</body>
</html>
