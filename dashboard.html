<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --primary-glow: rgba(82, 120, 220, 0.15);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: all 0.2s ease;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= رأس الصفحة والعملات ================= */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 0 4px;
}

.currency-selector-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 6px 12px;
  border-radius: 14px;
  backdrop-filter: blur(10px);
}

.currency-selector-badge button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 2px 4px;
}

.currency-selector-badge button.active {
  color: #fff;
  border-bottom: 2px solid var(--accent-color);
}

.balance-display {
  text-align: left;
}

.balance-amount {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.5px;
}

/* ================= الأزرار الكبيرة (استقبال / إرسال) ================= */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.action-card {
  height: 90px;
  border-radius: 20px;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.action-card.receive {
  background: linear-gradient(135deg, #34d399, #059669);
  color: #fff;
}

.action-card.send {
  background: linear-gradient(135deg, #f87171, #dc2626);
  color: #fff;
}

.action-card:hover {
  filter: brightness(1.05);
  transform: translateY(-2px);
}

/* ================= الخدمات الأربعة ================= */
.services-grid-small {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.service-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  backdrop-filter: blur(10px);
}

.service-box:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
}

.service-icon-wrap {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(82, 120, 220, 0.15);
  color: var(--accent-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.service-title {
  font-size: 14px;
  font-weight: 700;
}

/* ================= آخر التحويلات ================= */
.section-header {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.transactions-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tx-item {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 14px 16px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

.tx-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tx-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(52, 211, 153, 0.15);
  color: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.tx-name {
  font-size: 14px;
  font-weight: 700;
}

.tx-date {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.tx-amount {
  font-size: 14px;
  font-weight: 800;
  color: var(--success);
}

/* ================= شريط التنقل السفلي (Bottom Navigation) ================= */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(13, 27, 48, 0.95);
  backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border);
  padding: 10px 16px 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
}

.nav-item {
  background: none;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  cursor: pointer;
  text-decoration: none;
}

.nav-item.active {
  color: var(--accent-color);
  font-weight: 700;
}

.nav-item span {
  font-size: 18px;
}

.nav-qr-btn {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4);
  cursor: pointer;
  margin-top: -15px;
}
</style>
<script>
  // نظام الحماية: التحقق من تسجيل الدخول قبل عرض الصفحة
  if (localStorage.getItem('bankShamAuth') !== 'true') {
    alert('يرجى تسجيل الدخول أو إنشاء حساب أولاً للوصول إلى لوحة التحكم');
    location.href = 'index.html';
  }
</script>
</head>
<body>

<div class="page">
  <!-- رأس الصفحة (اختر العملة والرصيد) -->
  <div class="header-row">
    <div class="currency-selector-badge">
      <button class="active" onclick="switchCurrency('USD')">USD</button>
      <button onclick="switchCurrency('SYP')">SYP</button>
      <button onclick="switchCurrency('EUR')">EUR</button>
    </div>
    <div class="balance-display">
      <div id="mainBalance" class="balance-amount">1,428.67</div>
    </div>
  </div>

  <!-- أزرار الاستقبال والإرسال الكبيرة -->
  <div class="action-grid">
    <button class="action-card receive" onclick="location.href='receive.html'">
      <span>📥</span> استقبال
    </button>
    <button class="action-card send" onclick="location.href='transfer.html'">
      <span>📤</span> إرسال
    </button>
  </div>

  <!-- مربعات الخدمات الأربعة -->
  <div class="services-grid-small">
    <div class="service-box" onclick="alert('خدمة الفواتير قريبة')">
      <div class="service-icon-wrap">📄</div>
      <div class="service-title">فواتير</div>
    </div>
    <div class="service-box" onclick="alert('خدمة المدفوعات قريبة')">
      <div class="service-icon-wrap">💳</div>
      <div class="service-title">مدفوعات</div>
    </div>
    <div class="service-box" onclick="alert('خدمة البنوك قريبة')">
      <div class="service-icon-wrap">🏛️</div>
      <div class="service-title">بنوك</div>
    </div>
    <div class="service-box" onclick="location.href='transfer.html'">
      <div class="service-icon-wrap">🔄</div>
      <div class="service-title">حوالات</div>
    </div>
  </div>

  <!-- آخر التحويلات -->
  <div class="section-header">
    <span>آخر التحويلات</span>
  </div>

  <div class="transactions-container" id="recentTransactions">
    <div class="tx-item">
      <div class="tx-info">
        <div class="tx-icon">📥</div>
        <div>
          <div class="tx-name">لولو محمد علي</div>
          <div class="tx-date">اليوم، 10:30 صباحاً</div>
        </div>
      </div>
      <div class="tx-amount">+ USD 5</div>
    </div>

    <div class="tx-item">
      <div class="tx-info">
        <div class="tx-icon">📥</div>
        <div>
          <div class="tx-name">لولو محمد علي</div>
          <div class="tx-date">أمس، 04:15 عصراً</div>
        </div>
      </div>
      <div class="tx-amount">+ USD 10</div>
    </div>

    <div class="tx-item">
      <div class="tx-info">
        <div class="tx-icon">📥</div>
        <div>
          <div class="tx-name">أبو خالد الحمصي</div>
          <div class="tx-date">02/09/2026</div>
        </div>
      </div>
      <div class="tx-amount">+ USD 25</div>
    </div>
  </div>
</div>

<!-- شريط التنقل السفلي الأيقوني الثابت -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='profile.html'">
    <span>👤</span>
    الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span>
    البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'" title="رمز QR">
    📷
  </button>
  <button class="nav-item" onclick="location.href='transfer.html'">
    <span>💱</span>
    العمليات
  </button>
  <button class="nav-item active" onclick="location.href='dashboard.html'">
    <span>🏠</span>
    الرئيسية
  </button>
</nav>

<script>
function switchCurrency(curr) {
  document.querySelectorAll('.currency-selector-badge button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const balanceEl = document.getElementById('mainBalance');
  if(curr === 'USD') balanceEl.textContent = '1,428.67';
  else if(curr === 'SYP') balanceEl.textContent = '12,500,000';
  else if(curr === 'EUR') balanceEl.textContent = '1,310.20';
}
</script>

</body>
</html>
