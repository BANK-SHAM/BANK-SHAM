<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 0 4px;
}

.user-greeting {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 700;
}

.balance-display {
  text-align: left;
}

.balance-amount {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.5px;
}

.balance-currency {
  font-size: 12px;
  color: var(--text-muted);
}

.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.action-card {
  height: 85px;
  border-radius: 20px;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  text-decoration: none;
}

.action-card.receive { background: linear-gradient(135deg, #34d399, #059669); color: #fff; }
.action-card.send { background: linear-gradient(135deg, #f87171, #dc2626); color: #fff; }

.services-grid-small {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.service-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  text-decoration: none;
  color: var(--text-main);
  border: none;
  width: 100%;
  text-align: right;
}

.service-icon-wrap {
  width: 40px; height: 40px; border-radius: 12px;
  background: rgba(82, 120, 220, 0.15); color: var(--accent-color);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  flex-shrink: 0;
}

.service-title { font-size: 14px; font-weight: 700; }

.section-header {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 12px;
}

.transactions-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tx-item {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 14px 16px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

.tx-info { display: flex; align-items: center; gap: 12px; }
.tx-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(82, 120, 220, 0.15); color: var(--accent-color);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.tx-name { font-size: 13px; font-weight: 700; }
.tx-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.tx-status { font-size: 12px; font-weight: 800; color: #fbbf24; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
}
.modal-content {
  background: #0d1b30; border: 1px solid var(--card-border);
  width: 100%; max-width: 400px; padding: 24px; border-radius: 24px; text-align: right;
  max-height: 80vh; overflow-y: auto;
}
.form-input {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
  padding: 12px; border-radius: 12px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none;
}
.modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
.btn-modal { flex: 1; padding: 12px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; }
.btn-submit { background: var(--accent-color); color: #fff; }
.btn-cancel { background: rgba(255,255,255,0.08); color: var(--text-muted); }

/* القائمة السفلية */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; margin-top: -15px;
  text-decoration: none;
}
</style>

<!-- استيراد مكتبة Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function fetchDashboardData() {
    if (localStorage.getItem('bankShamAuth') !== 'true') {
      alert('يرجى تسجيل الدخول أولاً');
      location.href = 'index.html';
      return;
    }

    const currentAcc = localStorage.getItem('bankShamAccount');
    if (!currentAcc) {
      location.href = 'index.html';
      return;
    }

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      let foundUser = null;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        if (docId === currentAcc || data.accountNumber === currentAcc || data.account === currentAcc) {
          foundUser = data;
        }
      });

      if (foundUser) {
        const name = foundUser.name || foundUser.fullName || 'المستخدم';
        const balance = parseFloat(foundUser.balance || 0).toFixed(2);

        document.getElementById('userNameDisplay').textContent = 'مرحباً، ' + name;
        document.getElementById('userAccountBadge').textContent = 'رقم الحساب: ' + currentAcc;
        document.getElementById('mainBalance').textContent = balance;

        localStorage.setItem('bankShamBalance', balance);
        localStorage.setItem('bankShamUser', name);
      } else {
        document.getElementById('userNameDisplay').textContent = 'مرحباً، المستخدم';
        document.getElementById('userAccountBadge').textContent = 'رقم الحساب: ' + currentAcc;
        document.getElementById('mainBalance').textContent = '0.00';
      }
    } catch (err) {
      console.error(err);
      document.getElementById('userNameDisplay').textContent = 'مرحباً، المستخدم';
      document.getElementById('mainBalance').textContent = '0.00';
    }
  }

  // دالة جلب وعرض إشعارات عمليات الإرسال والاستلام من مجموعة transactions
  window.openTransfersModal = async function() {
    const modal = document.getElementById('transfersModal');
    const listContainer = document.getElementById('transfersListContainer');
    modal.style.display = 'flex';
    listContainer.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">جاري جلب سجل العمليات...</div>';

    const currentAcc = localStorage.getItem('bankShamAccount');

    try {
      const txSnapshot = await getDocs(collection(db, "transactions"));
      let htmlContent = '';
      let foundCount = 0;

      // ترتيب العمليات لتكون الأحدث أولاً إن أمكن أو حسب الإضافة
      let txList = [];
      txSnapshot.forEach((docSnap) => {
        txList.push(docSnap.data());
      });

      // ترتيب تصاعدي أو تنازلي بحسب الطابع الزمني
      txList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      txList.forEach((tx) => {
        // التحقق إن كانت العملية تخص المستخدم الحالي (إما مرسل أو مستلم)
        if (tx.sender === currentAcc || tx.recipient === currentAcc) {
          foundCount++;
          const isSender = (tx.sender === currentAcc);
          const typeText = isSender ? '📤 حوالة صادرة (إرسال)' : '📥 حوالة واردة (استلام)';
          const typeColor = isSender ? 'var(--error)' : 'var(--success)';
          const sign = isSender ? '-' : '+';
          const targetAcc = isSender ? tx.recipient : tx.sender;

          htmlContent += `
            <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); padding: 12px; border-radius: 14px; margin-bottom: 10px;">
              <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 4px;">
                <span style="color: ${typeColor};">${typeText}</span>
                <span style="color: ${typeColor};">${sign}${tx.amount || 0} USD</span>
              </div>
              <div style="font-size: 11px; color: var(--text-muted);">
                ${isSender ? 'إلى حساب: ' + targetAcc : 'من حساب: ' + targetAcc}
              </div>
              <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">${tx.date || 'عملية معتمدة'}</div>
            </div>
          `;
        }
      });

      if (foundCount === 0) {
        htmlContent = `
          <div style="text-align:center; padding: 20px; color: var(--text-muted);">
            <div style="font-size: 24px; margin-bottom: 8px;">📭</div>
            <div>لا توجد حوالات صادرة أو واردة مسجلة لهذا الحساب حتى الآن.</div>
          </div>
        `;
      }

      listContainer.innerHTML = htmlContent;

    } catch (err) {
      console.error(err);
      listContainer.innerHTML = `
        <div style="text-align:center; padding: 15px; color: var(--error);">
          حدث خطأ أثناء جلب السجلات. تأكد من اتصال الإنترنت وقواعد أمان قاعدة البيانات.
        </div>
      `;
    }
  };

  window.closeTransfersModal = function() {
    document.getElementById('transfersModal').style.display = 'none';
  };

  window.addEventListener('DOMContentLoaded', fetchDashboardData);
</script>
</head>
<body>

<div class="page">
  <div class="header-row">
    <div>
      <div class="user-greeting" id="userNameDisplay">جاري التحميل...</div>
      <div id="userAccountBadge" style="font-size: 11px; color: var(--accent-color); margin-top: 2px; font-weight: bold;"></div>
    </div>
    <div class="balance-display">
      <div id="mainBalance" class="balance-amount">0.00</div>
      <div class="balance-currency">USD (رصيد متاح)</div>
    </div>
  </div>

  <div class="action-grid">
    <button class="action-card receive" onclick="openDepositModal()">
      <span>📥</span> طلب تعبئة رصيد
    </button>
    <a href="transfer.html" class="action-card send">
      <span>📤</span> عمليات التحويل
    </a>
  </div>

  <div class="services-grid-small">
    <div class="service-box" onclick="alert('خدمة الفواتير قريبة')">
      <div class="service-icon-wrap">📄</div>
      <div class="service-title">فواتير</div>
    </div>
    <a href="transfer.html" class="service-box">
      <div class="service-icon-wrap">💳</div>
      <div class="service-title">العمليات</div>
    </a>
    <div class="service-box" onclick="alert('خدمة البنوك قريبة')">
      <div class="service-icon-wrap">🏛️</div>
      <div class="service-title">بنوك</div>
    </div>
    <!-- زر الحوالات المحدث لجلب وعرض الإرسال والاسقبال -->
    <button class="service-box" onclick="openTransfersModal()">
      <div class="service-icon-wrap">🔄</div>
      <div class="service-title">حوالات</div>
    </button>
  </div>

  <div class="section-header">
    <span>الطلبات والعمليات الأخيرة</span>
  </div>

  <div class="transactions-container" id="requestsContainer">
    <div class="tx-item">
      <div class="tx-info">
        <div class="tx-icon">⏳</div>
        <div>
          <div class="tx-name">حسابك السحابي نشط وآمن</div>
          <div class="tx-date">تم الربط بنجاح</div>
        </div>
      </div>
      <div class="tx-status">نشط</div>
    </div>
  </div>
</div>

<!-- نافذة طلب تعبئة الرصيد -->
<div class="modal-overlay" id="depositModal">
  <div class="modal-content">
    <div style="font-size: 17px; font-weight: 900; margin-bottom: 15px;">تقديم طلب تعبئة رصيد رسمي</div>
    <form onsubmit="submitDepositRequest(event)">
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px;">المبلغ المطلوب (USD)</label>
      <input type="number" id="depositAmount" class="form-input" placeholder="مثال: 100" min="1" required>
      
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px;">ملاحظات أو طريقة الدفع</label>
      <input type="text" id="depositNotes" class="form-input" placeholder="رقم الحوالة أو اسم الوكيل" required>

      <div class="modal-buttons">
        <button type="submit" class="btn-modal btn-submit">إرسال الطلب</button>
        <button type="button" class="btn-modal btn-cancel" onclick="closeDepositModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- نافذة إشعارات وسجل عمليات الحوالات (إرسال واستلام) -->
<div class="modal-overlay" id="transfersModal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div style="font-size: 17px; font-weight: 900;">إشعارات وعمليات الحوالات</div>
      <button onclick="closeTransfersModal()" style="background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">سجل الحوالات الصادرة والواردة لحسابك:</div>
    
    <div id="transfersListContainer">
      <!-- يتم حقن بيانات الحوالات هنا ديناميكياً من قاعدة البيانات -->
    </div>

    <div class="modal-buttons" style="margin-top: 20px;">
      <button type="button" class="btn-modal btn-cancel" onclick="closeTransfersModal()">إغلاق</button>
    </div>
  </div>
</div>

<!-- القائمة السفلية -->
<nav class="bottom-nav">
  <a href="profile.html" class="nav-item">
    <span>👤</span> الملف
  </a>
  <a href="cards.html" class="nav-item">
    <span>💳</span> البطاقات
  </a>
  <a href="qr.html" class="nav-qr-btn" title="رمز QR">
    📷
  </a>
  <a href="transfer.html" class="nav-item">
    <span>💱</span> العمليات
  </a>
  <a href="dashboard.html" class="nav-item active">
    <span>🏠</span> الرئيسية
  </a>
</nav>

<script>
function openDepositModal() { document.getElementById('depositModal').style.display = 'flex'; }
function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }
function submitDepositRequest(e) {
  e.preventDefault();
  alert('تم إرسال طلب التعبئة بنجاح.');
  closeDepositModal();
}
</script>

</body>
</html>
