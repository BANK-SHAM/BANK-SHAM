<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - محفظة إدلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        .dash-header {
            background: #1b4332;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info h3 {
            font-size: 16px;
        }
        .user-info span {
            font-size: 12px;
            color: #d8f3dc;
        }
        .settings-link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 6px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .balance-card {
            background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
            color: #fff;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.2);
        }
        .balance-card span {
            font-size: 14px;
            color: #e9f5ed;
        }
        .balance-card h1 {
            font-size: 32px;
            margin: 10px 0;
            font-weight: 900;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .action-btn {
            background: #fff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: 700;
            color: #1b4332;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .transactions-section {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .transactions-section h3 {
            font-size: 16px;
            color: #1b4332;
            margin-bottom: 15px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 8px;
        }
        .tx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f4f7f6;
            font-size: 14px;
        }
        .tx-item:last-child {
            border-bottom: none;
        }
        .tx-details p {
            font-weight: 600;
            color: #333;
        }
        .tx-details span {
            font-size: 12px;
            color: #888;
        }
        .tx-amount.positive { color: #2d6a4f; font-weight: 700; }
        .tx-amount.negative { color: #d90429; font-weight: 700; }
    </style>
</head>
<body>

    <header class="dash-header">
        <div class="user-info">
            <h3>أهلاً، أحمد خالد</h3>
            <span>الحساب: نشط وموثق</span>
        </div>
        <a href="settings.html" class="settings-link">⚙️ الإعدادات</a>
    </header>

    <div class="container">
        
        <!-- بطاقة الرصيد -->
        <div class="balance-card">
            <span>رصيدك الحالي</span>
            <h1>$1,450.00</h1>
            <span>دولار أمريكي</span>
        </div>

        <!-- أزرار العمليات السريعة (مربوطة بالصفحات الفعالة) -->
        <div class="actions-grid">
            <a href="send.html" class="action-btn">💸 إرسال أموال</a>
            <a href="agents.html" class="action-btn">📍 شبكة الوكلاء</a>
            <a href="history.html" class="action-btn">📊 السجل المالي</a>
            <a href="admin.html" class="action-btn" style="color: #d90429;">🔒 لوحة الإدارة</a>
        </div>

        <!-- آخر المعاملات -->
        <div class="transactions-section">
            <h3>آخر المعاملات</h3>
            
            <div class="tx-item">
                <div class="tx-details">
                    <p>تحويل إلى محمد علي</p>
                    <span>اليوم، 10:30 ص</span>
                </div>
                <div class="tx-amount negative">-$50.00</div>
            </div>

            <div class="tx-item">
                <div class="tx-details">
                    <p>استلام حوالة من رامي</p>
                    <span>أمس، 04:15 م</span>
                </div>
                <div class="tx-amount positive">+$200.00</div>
            </div>

            <div class="tx-item">
                <div class="tx-details">
                    <p>شحن رصيد عبر الوكيل</p>
                    <span>10 سبتمبر</span>
                </div>
                <div class="tx-amount positive">+$500.00</div>
            </div>
        </div>

    </div>

</body>
</html>
