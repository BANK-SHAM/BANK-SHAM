<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= رأس الصفحة والعملات ================= */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 0 4px;
}

.user-greeting {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 700;
}

.balance-display {
  text-align: left;
}

.balance-amount {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.5px;
}

.balance-currency {
  font-size: 12px;
  color: var(--text-muted);
}

/* ================= الأزرار الكبيرة (تعبئة رصيد / إرسال) ================= */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.action-card {
  height: 85px;
  border-radius: 20px;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.action-card.receive {
  background: linear-gradient(135deg, #34d399, #059669);
  color: #fff;
}

.action-card.send {
  background: linear-gradient(135deg, #f87171, #dc2626);
  color: #fff;
}

.action-card:hover { filter: brightness(1.05); transform: translateY(-2px); }

/* ================= الخدمات الأربعة ================= */
.services-grid-small {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.service-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  backdrop-filter: blur(10px);
}

.service-box:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }

.service-icon-wrap {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(82, 120, 220, 0.15);
  color: var(--accent-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.service-title { font-size: 14px; font-weight: 700; }

/* ================= قسم الطلبات والتحويلات ================= */
.section-header {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.transactions-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tx-item {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 14px 16px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

.tx-info { display: flex; align-items: center; gap: 12px; }
.tx-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(82, 120, 220, 0.15); color: var(--accent-color);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.tx-name { font-size: 13px; font-weight: 700; }
.tx-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.tx-status { font-size: 12px; font-weight: 800; color: #fbbf24; }

/* ================= Modal (نافذة طلب التعبئة) ================= */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
}
.modal-content {
  background: #0d1b30; border: 1px solid var(--card-border);
  width: 100%; max-width: 400px; padding: 24px; border-radius: 24px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: right;
}
.modal-title { font-size: 17px; font-weight: 900; margin-bottom: 15px; }
.form-input {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
  padding: 12px; border-radius: 12px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none;
}
.modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
.btn-modal { flex: 1; padding: 12px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; }
.btn-submit { background: var(--accent-color); color: #fff; }
.btn-cancel { background: rgba(255,255,255,0.08); color: var(--text-muted); }

/* ================= شريط التنقل السفلي ================= */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4); cursor: pointer; margin-top: -15px;
}
</style>
<script>
  // نظام الحماية: التحقق من الجلسة
  if (localStorage.getItem('bankShamAuth') !== 'true') {
    alert('يرجى تسجيل الدخول أولاً');
    location.href = 'index.html';
  }
</script>
</head>
<body>

<div class="page">
  <!-- رأس الصفحة -->
  <div class="header-row">
    <div>
      <div class="user-greeting" id="userNameDisplay">مرحباً، المستخدم</div>
    </div>
    <div class="balance-display">
      <div id="mainBalance" class="balance-amount">0.00</div>
      <div class="balance-currency">USD (رصيد متاح)</div>
    </div>
  </div>

  <!-- الأزرار الرئيسية -->
  <div class="action-grid">
    <button class="action-card receive" onclick="openDepositModal()">
      <span>📥</span> طلب تعبئة رصيد
    </button>
    <button class="action-card send" onclick="location.href='transfer.html'">
      <span>📤</span> إرسال حوالة
    </button>
  </div>

  <!-- الخدمات المصرفية -->
  <div class="services-grid-small">
    <div class="service-box" onclick="alert('خدمة الفواتير قريبة')">
      <div class="service-icon-wrap">📄</div>
      <div class="service-title">فواتير</div>
    </div>
    <div class="service-box" onclick="alert('خدمة المدفوعات قريبة')">
      <div class="service-icon-wrap">💳</div>
      <div class="service-title">مدفوعات</div>
    </div>
    <div class="service-box" onclick="alert('خدمة البنوك قريبة')">
      <div class="service-icon-wrap">🏛️</div>
      <div class="service-title">بنوك</div>
    </div>
    <div class="service-box" onclick="location.href='transfer.html'">
      <div class="service-icon-wrap">🔄</div>
      <div class="service-title">حوالات</div>
    </div>
  </div>

  <!-- الطلبات والعمليات -->
  <div class="section-header">
    <span>الطلبات والعمليات الأخيرة</span>
  </div>

  <div class="transactions-container" id="requestsContainer">
    <div class="tx-item">
      <div class="tx-info">
        <div class="tx-icon">⏳</div>
        <div>
          <div class="tx-name">حسابك الجديد جاهز</div>
          <div class="tx-date">الرصيد الابتدائي مفعل</div>
        </div>
      </div>
      <div class="tx-status">نشط</div>
    </div>
  </div>
</div>

<!-- نافذة تقديم طلب التعبئة الرسمي -->
<div class="modal-overlay" id="depositModal">
  <div class="modal-content">
    <div class="modal-title">تقديم طلب تعبئة رصيد رسمي</div>
    <form onsubmit="submitDepositRequest(event)">
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px;">المبلغ المطلوب (USD)</label>
      <input type="number" id="depositAmount" class="form-input" placeholder="مثال: 100" min="1" required>
      
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px;">ملاحظات أو طريقة الدفع (إيصال/حوالة)</label>
      <input type="text" id="depositNotes" class="form-input" placeholder="رقم الحوالة أو اسم الوكيل" required>

      <div class="modal-buttons">
        <button type="submit" class="btn-modal btn-submit">إرسال الطلب</button>
        <button type="button" class="btn-modal btn-cancel" onclick="closeDepositModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='profile.html'">
    <span>👤</span> الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span> البطاقات
  </button>
  <button class="nav-qr-btn" onclick="location.href='qr.html'" title="رمز QR">
    📷
  </button>
  <button class="nav-item" onclick="location.href='transfer.html'">
    <span>💱</span> العمليات
  </button>
  <button class="nav-item active" onclick="location.href='dashboard.html'">
    <span>🏠</span> الرئيسية
  </button>
</nav>

<script>
// تحميل بيانات المستخدم والرصيد عند فتح الصفحة
window.onload = function() {
  const userName = localStorage.getItem('bankShamUser') || 'المستخدم';
  const balance = localStorage.getItem('bankShamBalance') || '0.00';
  
  document.getElementById('userNameDisplay').textContent = 'مرحباً، ' + userName;
  document.getElementById('mainBalance').textContent = balance;
};

function openDepositModal() {
  document.getElementById('depositModal').style.display = 'flex';
}

function closeDepositModal() {
  document.getElementById('depositModal').style.display = 'none';
}

function submitDepositRequest(e) {
  e.preventDefault();
  const amount = document.getElementById('depositAmount').value;
  const notes = document.getElementById('depositNotes').value;

  if(!amount || !notes) return;

  // إضافة الطلب لقائمة العمليات كـ "قيد المراجعة"
  const container = document.getElementById('requestsContainer');
  const newReq = document.createElement('div');
  newReq.className = 'tx-item';
  newReq.innerHTML = `
    <div class="tx-info">
      <div class="tx-icon">⏳</div>
      <div>
        <div class="tx-name">طلب تعبئة: $${amount}</div>
        <div class="tx-date">${notes}</div>
      </div>
    </div>
    <div class="tx-status" style="color: #fbbf24;">قيد المراجعة</div>
  `;
  container.prepend(newReq);

  closeDepositModal();
  alert('تم تقديم طلب التعبئة بنجاح وسيتم معالجته من قبل الإدارة قريباً.');
  document.getElementById('depositAmount').value = '';
  document.getElementById('depositNotes').value = '';
}
</script>

</body>
</html>
