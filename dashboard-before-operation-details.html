<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>حسابي | BANK SHAM</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(25,211,174,.12),
                    transparent 30%
                ),
                #07111f;

            color: white;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: auto;
            padding: 20px;
        }

        /* NAVBAR */

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(11,25,40,.9);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #19d3ae;
            color: #06151a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .brand strong {
            display: block;
            font-size: 17px;
        }

        .brand small {
            color: #8192a6;
            font-size: 11px;
        }

        .logout {
            border: 1px solid rgba(255,255,255,.1);
            background: transparent;
            color: #ff8585;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* WELCOME */

        .welcome {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .welcome span {
            color: #19d3ae;
            font-size: 13px;
        }

        .welcome h1 {
            margin-top: 7px;
            font-size: 27px;
        }

        .welcome p {
            color: #8192a6;
            margin-top: 8px;
            font-size: 13px;
        }

        /* BALANCE */

        .balance-card {
            position: relative;
            overflow: hidden;
            animation: balanceEnter .5s ease both;
            background:
                radial-gradient(
                    circle at 85% 15%,
                    rgba(25,211,174,.18),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #123847,
                    #0b1d2c 65%,
                    #081521
                );

            border: 1px solid rgba(25,211,174,.28);
            border-radius: 24px;
            padding: 27px;
            box-shadow:
                0 20px 50px rgba(0,0,0,.28),
                inset 0 1px 0 rgba(255,255,255,.05);
        }

        @keyframes balanceEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .balance-card::after {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(25,211,174,.06);
            top: -70px;
            left: -50px;
            pointer-events: none;
        }

        .balance-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .balance-label {
            color: #91a4b7;
            font-size: 13px;
        }

        .balance {
            margin-top: 10px;
            font-size: 34px;
            font-weight: bold;
        }

        .currency {
            color: #19d3ae;
            font-size: 16px;
        }

        .bs {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            background: #19d3ae;
            color: #06151a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .account-number {
            margin-top: 30px;
            color: #9dafbf;
            font-size: 13px;
        }

        .copy-account {
            margin-right: 8px;
            padding: 6px 10px;
            border: 1px solid rgba(25,211,174,.25);
            border-radius: 9px;
            background: rgba(25,211,174,.08);
            color: #19d3ae;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-account:active {
            transform: scale(.96);
        }

        .copy-message {
            margin-right: 6px;
            color: #19d3ae;
            font-size: 11px;
        }

        .account-number strong {
            color: white;
            letter-spacing: 2px;
        }

        /* ACTIONS */

        .actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .action {
            padding: 18px 10px;
            background: linear-gradient(145deg, #0f2235, #091522);
            animation: actionEnter .45s ease both;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 17px;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,.18);
        }

        @keyframes actionEnter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .action:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,.16);
            box-shadow: 0 12px 26px rgba(0,0,0,.28);
        }

        .action:active {
            transform: scale(.97);
        }

        .action-icon {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .action span {
            display: block;
            color: #c4d0db;
            font-size: 12px;
        }

        /* GRID */

        .section {
            margin-top: 28px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .transactions {
            background: #0b1928;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 18px;
            overflow: hidden;
        }

        .transaction {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px;
            border-bottom: 1px solid rgba(255,255,255,.05);
            transition: background .2s ease, transform .2s ease;
        }

        .transaction:hover {
            background: rgba(255,255,255,.025);
            transform: translateX(-2px);
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(25,211,174,.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transaction-icon.received {
            background: rgba(25,211,174,.12);
            color: #19d3ae;
        }

        .transaction-icon.sent {
            background: rgba(255,95,95,.12);
            color: #ff6b6b;
        }

        .transaction-info strong {
            display: block;
            font-size: 13px;
        }

        .transaction-info small {
            display: block;
            color: #718398;
            margin-top: 5px;
            font-size: 11px;
        }

        .amount {
            color: #19d3ae;
            font-weight: 800;
            font-size: 14px;
            white-space: nowrap;
            letter-spacing: .2px;
        }

        /* NOTICE */

        .notice {
            margin-top: 25px;
            padding: 15px;
            border-radius: 14px;
            background: rgba(25,211,174,.07);
            border: 1px solid rgba(25,211,174,.12);
            color: #91a9b8;
            font-size: 12px;
            line-height: 1.7;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .actions {
                grid-template-columns: repeat(2, 1fr);
            }

            .balance {
                font-size: 28px;
            }

            .welcome h1 {
                font-size: 23px;
            }

        }

    </style>

</head>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {

    signOut,

};



function openDeposit() {
    const modal = document.getElementById("depositModal");
    const amount = document.getElementById("depositAmount");
    const message = document.getElementById("depositMessage");

    if (!modal) return;

    modal.style.display = "flex";

    if (amount) {
        amount.value = "";
        amount.focus();
    }

    if (message) {
        message.textContent = "";
    }
}

function closeDeposit() {
    const modal = document.getElementById("depositModal");

    if (modal) {
        modal.style.display = "none";
    }
}

async function submitDeposit() {
    const amount = Number(
        document.getElementById("depositAmount")?.value || 0
    );

    const message =
        document.getElementById("depositMessage");

    if (amount < 0.01) {
        message.textContent =
            "❌ يجب أن تكون القيمة أكبر من 0.01";
        return;
    }

    try {
        const user = auth.currentUser;

        if (!user) {
            message.textContent =
                "❌ يجب تسجيل الدخول أولًا.";
            return;
        }

        message.textContent = "⏳ جارٍ تنفيذ الإيداع...";

        const result = await depositMoney({
            amount: amount
        });

        message.textContent =
            "✅ " + (result.data?.message || "تم الإيداع بنجاح.");

        setTimeout(() => {
            closeDeposit();
        }, 1200);

    } catch (error) {
        console.error("Deposit error:", error);

        message.textContent =
            "❌ " + (error.message || "فشل الإيداع.");
    }
}


function openWithdraw() {
    const modal = document.getElementById("withdrawModal");
    const amount = document.getElementById("withdrawAmount");
    const message = document.getElementById("withdrawMessage");

    if (amount) amount.value = "";
    if (message) message.textContent = "";

    if (modal) {
        modal.style.display = "flex";
    }

    setTimeout(() => {
        amount?.focus();
    }, 100);
}

function closeWithdraw() {
    const modal = document.getElementById("withdrawModal");

    if (modal) {
        modal.style.display = "none";
    }
}

async function submitWithdraw() {
    const amount = Number(
        document.getElementById("withdrawAmount")?.value || 0
    );

    const message =
        document.getElementById("withdrawMessage");

    if (amount < 0.01) {
        message.textContent =
            "❌ يجب أن تكون القيمة أكبر من 0.01";
        return;
    }

    try {
        const user = auth.currentUser;

        if (!user) {
            message.textContent =
                "❌ يجب تسجيل الدخول أولًا.";
            return;
        }

        message.textContent =
            "⏳ جارٍ تنفيذ السحب...";

        const result = await withdrawMoney({
            amount: amount
        });

        message.textContent =
            "✅ " + (
                result.data?.message ||
                "تم السحب بنجاح."
            );

        setTimeout(() => {
            closeWithdraw();
        }, 1200);

    } catch (error) {
        console.error("Withdraw error:", error);

        message.textContent =
            "❌ " + (
                error.message ||
                "فشل السحب."
            );
    }
}


async function openOperations() {
    const modal = document.getElementById("operationsModal");
    const list = document.getElementById("operationsList");

    if (!modal || !list) return;

    modal.style.display = "flex";

    const user = auth.currentUser;

    if (!user) {
        list.innerHTML = `
            <div style="
                text-align:center;
                color:#ff6b6b;
                padding:40px 15px;
            ">
                ❌ يجب تسجيل الدخول أولًا.
            </div>
        `;
        return;
    }

    list.innerHTML = `
        <div style="
            text-align:center;
            color:#8192a6;
            padding:40px 10px;
        ">
            ⏳ جارٍ تحميل العمليات...
        </div>
    `;

    try {
        const q = query(
            collection(db, "transactions"),
            where("senderUid", "==", user.uid),
            limit(100)
        );

        const q2 = query(
            collection(db, "transactions"),
            where("receiverUid", "==", user.uid),
            limit(100)
        );

        const [sentSnap, receivedSnap] =
            await Promise.all([
                getDocs(q),
                getDocs(q2)
            ]);

        const operations = [];

        sentSnap.forEach(doc => {
            operations.push({
                id: doc.id,
                ...doc.data()
            });
        });

        receivedSnap.forEach(doc => {
            if (!operations.some(op => op.id === doc.id)) {
                operations.push({
                    id: doc.id,
                    ...doc.data()
                });
            }
        });

        operations.sort((a, b) => {
            const aTime = a.createdAt?.seconds || 0;
            const bTime = b.createdAt?.seconds || 0;
            return bTime - aTime;
        });

        if (operations.length === 0) {
            list.innerHTML = `
                <div style="
                    text-align:center;
                    color:#8192a6;
                    padding:45px 15px;
                ">
                    <div style="font-size:42px;margin-bottom:12px;">
                        📭
                    </div>
                    <div style="
                        font-size:15px;
                        font-weight:bold;
                        color:#d7e2ee;
                    ">
                        لا توجد عمليات حتى الآن
                    </div>
                </div>
            `;
            return;
        }

        list.innerHTML = operations.map(op => {

            const isWithdraw = op.type === "withdraw";
            const isDeposit = op.type === "deposit";

            const isReceived =
                op.receiverUid === user.uid &&
                !isDeposit;

            let icon = "🔄";
            let title = "تحويل";
            let subtitle = "عملية تحويل";

            if (isDeposit) {

async function loadTransactions(user) {

    if (!transactionsList) return;

    try {

        const transactionsRef =
            collection(db, "transactions");

        const sentQuery =
            query(
                transactionsRef,
                where("senderUid", "==", user.uid),
                orderBy("createdAt", "desc"),
                limit(10)
            );

        const receivedQuery =
            query(
                transactionsRef,
                where("receiverUid", "==", user.uid),
                orderBy("createdAt", "desc"),
                limit(10)
            );

        const [sentSnapshot, receivedSnapshot] =
            await Promise.all([
                getDocs(sentQuery),
                getDocs(receivedQuery)
            ]);

        const transactions = [];

        sentSnapshot.forEach((transactionDoc) => {

            transactions.push({
                id: transactionDoc.id,
                data: transactionDoc.data(),
                type: "sent"
            });

        });

        receivedSnapshot.forEach((transactionDoc) => {

            if (!transactions.some(t => t.id === transactionDoc.id)) {

                transactions.push({
                    id: transactionDoc.id,
                    data: transactionDoc.data(),
                    type: "received"
                });

            }

        });

        transactions.sort((a, b) => {

            const aTime =
                a.data.createdAt?.toMillis
                    ? a.data.createdAt.toMillis()
                    : 0;

            const bTime =
                b.data.createdAt?.toMillis
                    ? b.data.createdAt.toMillis()
                    : 0;

            return bTime - aTime;

        });

        if (transactions.length === 0) {

            transactionsList.innerHTML = `
                <div class="transaction">
                    <div class="transaction-info">
                        <div class="transaction-icon">📭</div>
                        <div>
                            <strong>لا توجد عمليات تحويل</strong>
                            <small>لم يتم العثور على عمليات لهذا الحساب</small>
                        </div>
                    </div>
                </div>
            `;

            return;
        }

        transactionsList.innerHTML = "";

        transactions.slice(0, 10).forEach((transaction) => {

            const data = transaction.data;

            const amount =
                Number(data.amount || 0).toLocaleString();

            const isReceived =
                transaction.type === "received";

            const otherAccount =
                isReceived
                    ? data.senderAccountNumber
                    : data.receiverAccountNumber;

            const date =
                data.createdAt?.toDate
                    ? data.createdAt.toDate().toLocaleString("ar")
                    : "الآن";

            transactionsList.innerHTML += `
                <div class="transaction">

                    <div class="transaction-info">

                        <div class="transaction-icon ${isReceived ? "received" : "sent"}">
                            ${isReceived ? "↙" : "↗"}
                        </div>

                        <div>

                            <strong>
                                ${isReceived ? "تحويل وارد" : "تحويل صادر"}
                            </strong>

                            <small>
                                ${isReceived ? "من الحساب" : "إلى الحساب"}
                                ${otherAccount || "غير معروف"}
                                • ${date}
                            </small>

                        </div>

                    </div>

                    <div class="amount">
                        ${isReceived ? "+" : "-"}${amount}
                        ${data.currency || "USD"}
                    </div>

                </div>
            `;

        });

    } catch (error) {

        console.error(
            "Transactions error:",
            error
        );

        transactionsList.innerHTML = `
            <div class="transaction">
                <div class="transaction-info">
                    <div class="transaction-icon">⚠️</div>
                    <div>
                        <strong>تعذر تحميل العمليات</strong>
                        <small>${error.message}</small>
                    </div>
                </div>
            </div>
        `;

    }

}


let stopTransactionsListener = null;

function watchUserTransactions(user) {

    if (stopTransactionsListener) {

    const sentQuery = query(
        transactionsRef,
        where("senderUid", "==", user.uid),

    );

        where("receiverUid", "==", user.uid),

    let receivedData = [];

        const transactions = [];

        sentData.forEach((data, index) => {
            transactions.push({
                id: data.id,
                data: data.data,
                type: "sent"
            });
        });

        receivedData.forEach((data, index) => {
            if (!transactions.some(t => t.id === data.id)) {
                transactions.push({
                    id: data.id,
                    data: data.data,
                    type: "received"
                });
            }
        });

        transactions.sort((a, b) => {

            const aTime =
                a.data.createdAt?.toMillis
                    ? a.data.createdAt.toMillis()
                    : 0;

            const bTime =
                b.data.createdAt?.toMillis
                    ? b.data.createdAt.toMillis()
                    : 0;

            return bTime - aTime;
        });

        if (transactions.length === 0) {
            transactionsList.innerHTML = `
                <div class="transaction">
                    <div class="transaction-info">
                        <div class="transaction-icon">📭</div>
                        <div>
                            <strong>لا توجد عمليات تحويل</strong>
                            <small>لم يتم العثور على عمليات لهذا الحساب</small>
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        transactionsList.innerHTML = "";

        transactions.slice(0, 10).forEach((transaction) => {

            const data = transaction.data;

            const amount =
                Number(data.amount || 0).toLocaleString();

            const isReceived =
                transaction.type === "received";

            const otherAccount =
                isReceived
                    ? data.senderAccountNumber
                    : data.receiverAccountNumber;

            const date =
                data.createdAt?.toDate
                    ? data.createdAt.toDate().toLocaleString("ar")
                    : "الآن";

            transactionsList.innerHTML += `
                <div class="transaction">
                    <div class="transaction-info">
                        <div class="transaction-icon ${isReceived ? "received" : "sent"}">
                            ${isReceived ? "↙" : "↗"}
                        </div>
                        <div>
                            <strong>
                                ${isReceived ? "تحويل وارد" : "تحويل صادر"}
                            </strong>
                            <small>
                                ${isReceived ? "من الحساب" : "إلى الحساب"}
                                ${otherAccount || "غير معروف"}
                                • ${date}
                            </small>
                        </div>
                    </div>

                    <div class="amount">
                        ${isReceived ? "+" : "-"}${amount}
                        ${data.currency || "USD"}
                    </div>
                </div>
            `;
        });
    };

    const unsubscribeSent = onSnapshot(
        sentQuery,
        (snapshot) => {
            sentData = snapshot.docs.map(doc => ({
                id: doc.id,
                data: doc.data()
            }));
            renderTransactions();
        },
        (error) => {
            console.error("Sent transactions error:", error);
        }
    );

    const unsubscribeReceived = onSnapshot(
        receivedQuery,
        (snapshot) => {
            receivedData = snapshot.docs.map(doc => ({
                id: doc.id,
                data: doc.data()
            }));
            renderTransactions();
        },
        (error) => {
            console.error("Received transactions error:", error);
        }
    );

    stopTransactionsListener = () => {
        unsubscribeSent();
        unsubscribeReceived();
    };
}

async function copyAccountNumber() {

    const accountElement =
        document.getElementById("accountNumberValue");

    if (!accountElement) return;

    const accountNumber =
        accountElement.textContent.trim();

    if (!accountNumber || accountNumber === "غير متوفر") {
        return;
    }

    try {

        if (navigator.clipboard && window.isSecureContext) {

            await navigator.clipboard.writeText(accountNumber);

        } else {

            const textArea = document.createElement("textarea");

            textArea.value = accountNumber;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";

            document.body.appendChild(textArea);

            textArea.focus();
            textArea.select();

            document.execCommand("copy");

            textArea.remove();
        }

        const message =
            document.getElementById("copyMessage");

        message.textContent = "تم النسخ ✓";

        setTimeout(() => {
            message.textContent = "";
        }, 2000);

    } catch (error) {

        console.error("Copy error:", error);

        alert("تعذر نسخ رقم الحساب تلقائيًا: " + accountNumber);

    }
}
window.copyAccountNumber = copyAccountNumber;
