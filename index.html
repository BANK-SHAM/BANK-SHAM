    <script>
        async function submitOrder(e) {
            e.preventDefault();
            
            const service = document.getElementById('service').value;
            const link = document.getElementById('link').value;
            const quantity = document.getElementById('quantity').value;
            const msg = document.getElementById('msg');

            // تجهيز البيانات للإرسال
            const formData = new FormData();
            formData.append('service', service);
            formData.append('link', link);
            formData.append('quantity', quantity);

            try {
                // إرسال البيانات إلى ملف process.php
                const response = await fetch('process.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                msg.textContent = result.message;
                msg.classList.remove('hidden', 'text-red-400');
                msg.classList.add(result.status === 'success' ? 'text-green-400' : 'text-red-400');
                
                if (result.status === 'success') {
                    document.getElementById('orderForm').reset();
                }
            } catch (error) {
                msg.textContent = 'حدث خطأ في الاتصال، حاول مرة أخرى.';
                msg.classList.remove('hidden', 'text-green-400');
                msg.classList.add('text-red-400');
            }

            setTimeout(() => {
                msg.classList.add('hidden');
            }, 4000);
        }
    </script>
