<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BANK SHAM | بنك شام الرقمي</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }
body { margin: 0; min-height: 100vh; background: var(--bg-gradient); color: var(--text-main); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
.container { width: 100%; max-width: 480px; margin: auto; }
.hero { text-align: center; padding: 30px 0; }
.logo-box { width: 75px; height: 75px; background: linear-gradient(135deg, #5278dc, #3b5cb8); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #fff; margin: 0 auto 15px; box-shadow: 0 10px 25px rgba(82,120,220,0.4); }
h1 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
p { color: var(--text-muted); font-size: 13px; line-height: 1.5; margin-bottom: 25px; }
.auth-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 22px; border-radius: 22px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.form-group { margin-bottom: 14px; text-align: right; }
.form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; display: block; }
.form-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); padding: 12px 14px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
.form-input:focus { border-color: var(--accent-color); }
.btn-primary { width: 100%; background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 6px 20px rgba(82,120,220,0.3); }
.btn-primary:hover { filter: brightness(1.05); }
.switch-mode { text-align: center; margin-top: 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
.switch-mode span { color: var(--accent-color); font-weight: 700; }
.footer { text-align: center; font-size: 11px; color: var(--text-muted); padding: 10px 0; }
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="logo-box">BS</div>
    <h1>BANK SHAM</h1>
    <p>المنصة المالية الرقمية الآمنة لإدارة أموالك، تحويل الأموال، والمدفوعات بكل سهولة وسرعة.</p>
  </div>

  <div class="auth-box">
    <h2 id="formTitle" style="text-align: center; font-size: 17px; margin-bottom: 18px;">تسجيل الدخول</h2>
    
    <form id="authForm" onsubmit="handleAuth(event)">
      <!-- حقل الاسم يظهر فقط عند التسجيل -->
      <div class="form-group" id="nameGroup" style="display: none;">
        <label class="form-label">الاسم الكامل</label>
        <input type="text" id="fullName" class="form-input" placeholder="أدخل اسمك الكامل">
      </div>

      <!-- حقل رقم الحساب -->
      <div class="form-group" id="accountGroup">
        <label class="form-label" id="accountLabel">رقم الحساب</label>
        <input type="text" id="userAccount" class="form-input" placeholder="أدخل رقم الحساب المكون من أرقام" inputmode="numeric" required>
      </div>

      <div class="form-group">
        <label class="form-label">رمز الأمان (PIN - 4 أرقام)</label>
        <input type="password" id="userPin" class="form-input" placeholder="••••" maxlength="4" inputmode="numeric" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">دخول</button>
    </form>

    <div class="switch-mode" id="switchText" onclick="toggleMode()">
      ليس لديك حساب؟ <span>إنشاء حساب جديد</span>
    </div>
  </div>
</div>

<div class="footer">
  © 2026 BANK SHAM — جميع الحقوق محفوظة
</div>

<script>
let isRegisterMode = false;

function toggleMode() {
  isRegisterMode = !isRegisterMode;
  const title = document.getElementById('formTitle');
  const nameGroup = document.getElementById('nameGroup');
  const accountGroup = document.getElementById('accountGroup');
  const accountInput = document.getElementById('userAccount');
  const accountLabel = document.getElementById('accountLabel');
  const submitBtn = document.getElementById('submitBtn');
  const switchText = document.getElementById('switchText');

  if(isRegisterMode) {
    title.innerText = "إنشاء حساب جديد";
    nameGroup.style.display = "block";
    
    // توليد رقم حساب تسلسلي فريد يعتمد على أحدث رقم مسجل في المتصفح أو قاعدة البيانات
    let users = JSON.parse(localStorage.getItem('bankShamAllUsers') || '[]');
    let lastSeqNumber = parseInt(localStorage.getItem('bankShamLastSeq') || '1000');
    
    // التأكد من أن الرقم الجديد أكبر من أي رقم موجود في القائمة أو الذاكرة
    users.forEach(u => {
      let accNum = parseInt(u.account);
      if(!isNaN(accNum) && accNum > lastSeqNumber) {
        lastSeqNumber = accNum;
      }
    });

    let nextAccountNumber = (lastSeqNumber + 1).toString();
    
    accountGroup.style.display = "block";
    accountInput.value = nextAccountNumber;
    accountInput.readOnly = true; // منع التعديل ليكون تسلسلياً ودقيقاً
    accountLabel.innerText = "رقم حسابك التسلسلي الجديد (تم توليده تلقائياً)";

    submitBtn.innerText = "إنشاء الحساب والبدء";
    switchText.innerHTML = "لديك حساب بالفعل؟ <span>تسجيل الدخول</span>";
  } else {
    title.innerText = "تسجيل الدخول";
    nameGroup.style.display = "none";
    
    accountGroup.style.display = "block";
    accountInput.value = "";
    accountInput.readOnly = false; // السماح بالكتابة عند تسجيل الدخول
    accountLabel.innerText = "رقم الحساب";

    submitBtn.innerText = "دخول";
    switchText.innerHTML = "ليس لديك حساب؟ <span>إنشاء حساب جديد</span>";
  }
}

function handleAuth(e) {
  e.preventDefault();
  const accountInput = document.getElementById('userAccount').value.trim();
  const pinInput = document.getElementById('userPin').value.trim();

  let users = JSON.parse(localStorage.getItem('bankShamAllUsers') || '[]');

  if(isRegisterMode) {
    const fullName = document.getElementById('fullName').value.trim();
    if(!fullName) {
      alert('يرجى إدخال الاسم الكامل');
      return;
    }
    if(pinInput.length < 4) {
      alert('يرجى إدخال رمز PIN مكون من 4 أرقام على الأقل');
      return;
    }

    // التحقق إن كان الحساب موجوداً مسبقاً لمنع التكرار
    let existing = users.find(u => u.account === accountInput);
    if(existing) {
      alert('خطأ: رقم الحساب هذا موجود مسبقاً، يرجى إعادة تحميل الصفحة.');
      return;
    }

    const newUser = {
      account: accountInput,
      pin: pinInput,
      name: fullName,
      balance: 0.00
    };

    users.push(newUser);
    localStorage.setItem('bankShamAllUsers', JSON.stringify(users));
    
    // حفظ آخر رقم تسلسلي تم توليده
    localStorage.setItem('bankShamLastSeq', accountInput);

    // تعيين الجلسة الحالية
    localStorage.setItem('bankShamAccount', accountInput);
    localStorage.setItem('bankShamPin', pinInput);
    localStorage.setItem('bankShamUser', fullName);
    localStorage.setItem('bankShamBalance', '0.00');
    localStorage.setItem('bankShamAuth', 'true');
    
    alert('تم إنشاء حسابك التسلسلي بنجاح! رقم حسابك هو: ' + accountInput);
    location.href = 'dashboard.html';

  } else {
    // تسجيل الدخول
    let foundUser = users.find(u => u.account === accountInput && u.pin === pinInput);

    if (foundUser) {
      localStorage.setItem('bankShamAccount', foundUser.account);
      localStorage.setItem('bankShamPin', foundUser.pin);
      localStorage.setItem('bankShamUser', foundUser.name);
      localStorage.setItem('bankShamBalance', (foundUser.balance || 0).toFixed(2));
      localStorage.setItem('bankShamAuth', 'true');
      location.href = 'dashboard.html';
    } else {
      alert('خطأ: رقم الحساب أو رمز الأمان غير صحيح!');
    }
  }
}
</script>

</body>
</html>
