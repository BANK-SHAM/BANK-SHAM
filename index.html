<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات رشق المتابعين السريعة</title>
    <!-- استيراد خطوط وتصميم جاهز (Tailwind CSS) للعمل السريع من الهاتف -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- الهيدر (شريط التنقل) -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-rocket"></i> SMM Store</h1>
        <a href="#order" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-500">اطلب الآن</a>
    </header>

    <!-- القسم الرئيسي (Hero Section) -->
    <section class="text-center py-12 px-4">
        <h2 class="text-3xl font-extrabold mb-4">أفضل وأسرع خدمات رشق المتابعين</h2>
        <p class="text-gray-400 mb-8 text-sm">عزز حضورك الرقمي على وسائل التواصل الاجتماعي بأفضل الأسعار وبشكل آلي بالكامل.</p>
        <div class="flex justify-center gap-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 w-1/2">
                <i class="fa-brands fa-instagram text-pink-500 text-3xl mb-2"></i>
                <h3 class="font-bold">انستغرام</h3>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 w-1/2">
                <i class="fa-brands fa-tiktok text-cyan-400 text-3xl mb-2"></i>
                <h3 class="font-bold">تيك توك</h3>
            </div>
        </div>
    </section>

    <!-- قسم نموذج الطلب (Order Form) -->
    <section id="order" class="max-w-md mx-auto bg-gray-800 p-6 rounded-2xl border border-gray-700 mb-12 shadow-xl">
        <h3 class="text-xl font-bold mb-4 text-center text-blue-400">إنشاء طلب جديد</h3>
        <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-300">اختر الخدمة:</label>
                <select id="service" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                    <option value="insta_followers">متابعين انستغرام (1000 متابع)</option>
                    <option value="tiktok_followers">متابعين تيك توك (1000 متابع)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">رابط الحساب (الرابط المطلوب):</label>
                <input type="url" id="link" required placeholder="https://instagram.com/username" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">الكمية:</label>
                <input type="number" id="quantity" value="1000" min="100" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg transition">إرسال الطلب</button>
        </form>
        <p id="msg" class="text-center mt-4 text-sm text-green-400 hidden">تم إرسال طلبك بنجاح!</p>
    </section>

    <!-- جافاسكريبت بسيط لتفاعل الطلب -->
    <script>
        function submitOrder(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.classList.remove('hidden');
            setTimeout(() => {
                msg.classList.add('hidden');
                document.getElementById('orderForm').reset();
            }, 3000);
        }
    </script>
</body>
</html>
