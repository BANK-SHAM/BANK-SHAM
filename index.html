<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BANK SHAM | بنك شام الرقمي</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }
body { margin: 0; min-height: 100vh; background: var(--bg-gradient); color: var(--text-main); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
.container { width: 100%; max-width: 480px; margin: auto; }
.hero { text-align: center; padding: 40px 0; }
.logo-box { width: 80px; height: 80px; background: linear-gradient(135deg, #5278dc, #3b5cb8); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff; margin: 0 auto 20px; box-shadow: 0 10px 25px rgba(82,120,220,0.4); }
h1 { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
.auth-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 24px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.form-group { margin-bottom: 16px; text-align: right; }
.form-label { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block; }
.form-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); padding: 14px; border-radius: 14px; color: #fff; font-size: 14px; outline: none; }
.form-input:focus { border-color: var(--accent-color); }
.btn-primary { width: 100%; background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 6px 20px rgba(82,120,220,0.3); }
.btn-primary:hover { filter: brightness(1.05); }
.switch-mode { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
.switch-mode span { color: var(--accent-color); font-weight: 700; }
.footer { text-align: center; font-size: 12px; color: var(--text-muted); padding: 10px 0; }
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="logo-box">BS</div>
    <h1>BANK SHAM</h1>
    <p>المنصة المالية الرقمية الآمنة لإدارة أموالك، تحويل الأموال، والمدفوعات بكل سهولة وسرعة.</p>
  </div>

  <div class="auth-box" id="authCard">
    <h2 id="formTitle" style="text-align: center; font-size: 18px; margin-bottom: 20px;">تسجيل الدخول</h2>
    
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label class="form-label">الاسم الكامل</label>
        <input type="text" id="fullName" class="form-input" placeholder="أدخل اسمك الكامل">
      </div>

      <div class="form-group">
        <label class="form-label">رقم الحساب أو اسم المستخدم</label>
        <input type="text" id="userAccount" class="form-input" placeholder="أدخل بيانات الحساب" required>
      </div>

      <div class="form-group">
        <label class="form-label">رمز الأمان (PIN - 4 أرقام)</label>
        <input type="password" id="userPin" class="form-input" placeholder="••••" maxlength="4" inputmode="numeric" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">دخول</button>
    </form>

    <div class="switch-mode" id="switchText" onclick="toggleMode()">
      ليس لديك حساب؟ <span>إنشاء حساب جديد</span>
    </div>
  </div>
</div>

<div class="footer">
  © 2026 BANK SHAM — جميع الحقوق محفوظة
</div>

<script>
let isRegisterMode = false;

function toggleMode() {
  isRegisterMode = !isRegisterMode;
  const title = document.getElementById('formTitle');
  const nameGroup = document.getElementById('nameGroup');
  const submitBtn = document.getElementById('submitBtn');
  const switchText = document.getElementById('switchText');

  if(isRegisterMode) {
    title.innerText = "إنشاء حساب جديد";
    nameGroup.style.display = "block";
    submitBtn.innerText = "إنشاء الحساب والبدء";
    switchText.innerHTML = "لديك حساب بالفعل؟ <span>تسجيل الدخول</span>";
  } else {
    title.innerText = "تسجيل الدخول";
    nameGroup.style.display = "none";
    submitBtn.innerText = "دخول";
    switchText.innerHTML = "ليس لديك حساب؟ <span>إنشاء حساب جديد</span>";
  }
}

function handleAuth(e) {
  e.preventDefault();
  const accountInput = document.getElementById('userAccount').value.trim();
  const pinInput = document.getElementById('userPin').value.trim();

  if(isRegisterMode) {
    // حالة إنشاء حساب جديد
    const fullName = document.getElementById('fullName').value.trim();
    if(!fullName) {
      alert('يرجى إدخال الاسم الكامل');
      return;
    }
    if(accountInput.length < 3 || pinInput.length < 4) {
      alert('يرجى إدخال رقم حساب صحيح ورمز PIN مكون من 4 أرقام');
      return;
    }

    // حفظ الحساب والرمز والاسم بشكل دائم في متصفح المستخدم
    localStorage.setItem('bankShamAccount', accountInput);
    localStorage.setItem('bankShamPin', pinInput);
    localStorage.setItem('bankShamUser', fullName);
    localStorage.setItem('bankShamAuth', 'true');
    
    alert('تم إنشاء الحساب بنجاح!');
    location.href = 'dashboard.html';

  } else {
    // حالة تسجيل الدخول (التحقق الصارم من الحساب المخزن)
    const savedAccount = localStorage.getItem('bankShamAccount');
    const savedPin = localStorage.getItem('bankShamPin');

    // إذا لم يكن هناك حساب مسجل نهائياً على هذا المتصفح، أو البيانات المدخلة لا تطابق المخزن
    if (!savedAccount || accountInput !== savedAccount || pinInput !== savedPin) {
      alert('خطأ: رقم الحساب أو رمز الأمان غير صحيح، أو أن الحساب غير مسجل! يرجى إنشاء حساب جديد أولاً.');
      return;
    }

    // إذا طابقت البيانات، يتم السماح بالدخول
    localStorage.setItem('bankShamAuth', 'true');
    location.href = 'dashboard.html';
  }
}
</script>

</body>
</html>
