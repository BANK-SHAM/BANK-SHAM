<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: all 0.2s ease;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 30px 24px;
  backdrop-filter: blur(20px);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.logo-circle {
  width: 70px;
  height: 70px;
  border-radius: 20px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 900;
  margin: 0 auto 14px;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.4);
}

.brand-header h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0 0 6px 0;
  letter-spacing: 0.5px;
}

.brand-header p {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0;
}

.form-group {
  margin-bottom: 18px;
}

.form-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: block;
  font-weight: 600;
}

.form-input {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  border-radius: 16px;
  color: #fff;
  font-size: 15px;
  outline: none;
  backdrop-filter: blur(10px);
}

.form-input:focus {
  border-color: var(--accent-color);
  background: rgba(82, 120, 220, 0.08);
  box-shadow: 0 0 15px rgba(82, 120, 220, 0.2);
}

.login-btn {
  width: 100%;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  padding: 16px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(82, 120, 220, 0.3);
  margin-top: 10px;
}

.login-btn:hover {
  filter: brightness(1.05);
  transform: translateY(-1px);
}

.footer-note {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="logo-circle">BS</div>
    <h1>BANK SHAM</h1>
    <p>بوابتك المصرفية الرقمية الآمنة</p>
  </div>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">اسم المستخدم أو رقم الحساب</label>
      <input type="text" id="usernameInput" class="form-input" placeholder="أدخل اسمك أو رقم الحساب" required>
    </div>

    <div class="form-group">
      <label class="form-label">رمز الأمان (PIN)</label>
      <input type="password" id="pinInput" class="form-input" placeholder="••••" maxlength="4" inputmode="numeric" required>
    </div>

    <button type="submit" class="login-btn">تسجيل الدخول</button>
  </form>

  <div class="footer-note">
    © 2026 BANK SHAM — جميع الحقوق محفوظة
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('usernameInput').value.trim();
  
  if(username) {
    // حفظ اسم المستخدم في ذاكرة المتصفح ليظهر في لوحة التحكم والملف الشخصي
    localStorage.setItem('bankShamUser', username);
    
    // الانتقال للوحة التحكم مباشرة
    location.href = 'dashboard.html';
  }
}
</script>

</body>
</html>
