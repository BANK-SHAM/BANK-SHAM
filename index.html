<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-ar="تداول النفط الخام - ابدأ الآن" data-en="Trade Crude Oil - Start Now">تداول النفط الخام - ابدأ الآن</title>
    <!-- استيراد خطوط وتنسيقات عصرية -->
    <style>
        :root {
            --primary-color: #f39c12;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* الهيدر وزر تغيير اللغة */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .lang-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .lang-btn:hover {
            background-color: var(--primary-color);
            color: #000;
        }

        /* المحتوى الرئيسي */
        .hero-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 50px;
            gap: 40px;
        }

        .hero-content {
            flex: 1;
            min-width: 300px;
        }

        .hero-content h1 {
            font-size: 40px;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-content p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* نموذج التسجيل */
        .form-card {
            flex: 1;
            min-width: 300px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        .form-card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* التجاوب مع الجوال */
        @media (max-width: 768px) {
            .hero-section {
                flex-direction: column;
                text-align: center;
            }
            .hero-content h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <header>
            <div class="logo">YWO Trade</div>
            <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">English</button>
        </header>

        <!-- قسم الهيرو (العنوان والنموذج) -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 data-ar="استغل تقلبات أسعار النفط الخام وابدأ التداول اليوم" 
                    data-en="Capitalize on Crude Oil Price Volatility and Start Trading Today">
                    استغل تقلبات أسعار النفط الخام وابدأ التداول اليوم
                </h1>
                <p data-ar="تداول النفط بفروق أسعار منخفضة للغاية، وسرعة فائقة في التنفيذ، ورافعة مالية مرنة تناسب استراتيجيتك." 
                   data-en="Trade crude oil with ultra-low spreads, lightning-fast execution, and flexible leverage tailored to your strategy.">
                    تداول النفط بفروق أسعار منخفضة للغاية، وسرعة فائقة في التنفيذ، ورافعة مالية مرنة تناسب استراتيجيتك.
                </p>
            </div>

            <!-- نموذج التسجيل السريع -->
            <div class="form-card">
                <h3 data-ar="فتح حساب تجريبي / حقيقي" data-en="Open a Trading Account">فتح حساب تجريبي / حقيقي</h3>
                <form onsubmit="handleSubmit(event)">
                    <div class="input-group">
                        <label data-ar="الاسم الكامل" data-en="Full Name">الاسم الكامل</label>
                        <input type="text" required placeholder="" id="nameInput">
                    </div>
                    <div class="input-group">
                        <label data-ar="البريد الإلكتروني" data-en="Email Address">البريد الإلكتروني</label>
                        <input type="email" required placeholder="" id="emailInput">
                    </div>
                    <div class="input-group">
                        <label data-ar="رقم الهاتف" data-en="Phone Number">رقم الهاتف</label>
                        <input type="tel" required placeholder="" id="phoneInput">
                    </div>
                    <button type="submit" class="submit-btn" data-ar="سجل الآن" data-en="Register Now">سجل الآن</button>
                </form>
            </div>
        </section>
    </div>

    <!-- كود جافاسكريبت للتحكم باللغة وتغيير اتجاه الصفحة -->
    <script>
        let currentLang = 'ar';

        function toggleLanguage() {
            const htmlTag = document.getElementById('htmlTag');
            const langToggleBtn = document.getElementById('langToggleBtn');
            
            if (currentLang === 'ar') {
                currentLang = 'en';
                htmlTag.setAttribute('lang', 'en');
                htmlTag.setAttribute('dir', 'ltr');
                langToggleBtn.innerText = 'العربية';
            } else {
                currentLang = 'ar';
                htmlTag.setAttribute('lang', 'ar');
                htmlTag.setAttribute('dir', 'rtl');
                langToggleBtn.innerText = 'English';
            }

            // تحديث النصوص بناءً على اللغة المتاحة
            const elements = document.querySelectorAll('[data-ar]');
            elements.forEach(el => {
                if (currentLang === 'en') {
                    el.innerText = el.getAttribute('data-en');
                } else {
                    el.innerText = el.getAttribute('data-ar');
                }
            });
        }

        function handleSubmit(e) {
            e.preventDefault();
            alert(currentLang === 'ar' ? 'تم إرسال طلبك بنجاح!' : 'Your request has been submitted successfully!');
        }
    </script>
</body>
</html>
