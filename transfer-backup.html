<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحويل الأموال - BANK SHAM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #10243b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aab8c8;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: #dce6f1;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #4da3ff;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #1479ff, #00b7ff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8ec8ff;
      text-decoration: none;
    }

    .notice {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,193,7,0.10);
      color: #ffd76a;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      min-height: 24px;
      line-height: 1.7;
    }

    .success {
      color: #55e6a5;
    }

    .error {
      color: #ff7272;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🏦 BANK SHAM</div>
    <div class="subtitle">تحويل داخلي</div>

    <form id="transferForm">

      <label for="receiverAccount">
        رقم حساب المستلم
      </label>

      <input
        id="receiverAccount"
        type="text"
        placeholder="أدخل رقم الحساب"
        autocomplete="off"
        required
      >

      <label for="amount">
        المبلغ
      </label>

      <input
        id="amount"
        type="number"
        placeholder="0.00"
        min="0.01"
        step="0.01"
        required
      >

      <label for="note">
        ملاحظة (اختيارية)
      </label>

      <input
        id="note"
        type="text"
        placeholder="سبب التحويل"
        maxlength="100"
      >

      <button id="transferBtn" type="submit">
        تحويل الأموال
      </button>

    </form>

    <div id="message"></div>

    <div class="notice">
      ⚠️ التحويلات في هذه المرحلة تجريبية فقط.
    </div>

    <a class="back" href="dashboard.html">
      ← العودة إلى الحساب
    </a>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      connectAuthEmulator
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFunctions,
      httpsCallable,
      connectFunctionsEmulator
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",

      authDomain:
        "ahmad-662ee.firebaseapp.com",

      projectId:
        "ahmad-662ee",

      storageBucket:
        "ahmad-662ee.firebasestorage.app",

      messagingSenderId:
        "740891153734",

      appId:
        "1:740891153734:web:80d3fd406214929c618147"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    // استخدام Authentication Emulator أثناء الاختبار المحلي
    if (
      location.hostname === "localhost" ||
      location.hostname === "127.0.0.1"
    ) {
      connectAuthEmulator(
        auth,
        "http://127.0.0.1:9099"
      );
    }

    const functions = getFunctions(app, "us-central1");


    // أثناء التطوير المحلي استخدم Functions Emulator
    if (
      location.hostname === "localhost" ||
      location.hostname === "127.0.0.1"
    ) {
      connectFunctionsEmulator(
        functions,
        "127.0.0.1",
        5001
      );
    }


    const transferMoney =
      httpsCallable(functions, "transferMoney");


    const form =
      document.getElementById("transferForm");

    const button =
      document.getElementById("transferBtn");

    const message =
      document.getElementById("message");


    let currentUser = null;
    let authReady = false;

    message.textContent =
      "⏳ جارٍ الاتصال بخدمة تسجيل الدخول...";

    onAuthStateChanged(auth, (user) => {

      currentUser = user;
      authReady = true;

      if (user) {
        console.log(
          "BANK SHAM - المستخدم مسجل:",
          user.email,
          user.uid
        );
      } else {
        console.log(
          "BANK SHAM - لا توجد جلسة دخول"
        );
      }

    });


    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      message.className = "";
      message.textContent = "";


      if (!authReady) {

        message.className = "error";
        message.textContent =
          "⏳ ما زال Firebase يتحقق من جلسة الدخول، انتظر لحظة ثم حاول مجددًا.";

        return;
      }

      const user = auth.currentUser || currentUser;

      if (!user) {

        message.className = "error";
        message.textContent =
          "❌ يجب تسجيل الدخول أولاً.";

        return;
      }

      currentUser = user;


      const receiverAccountNumber =
        document
          .getElementById("receiverAccount")
          .value
          .trim();


      const amount =
        Number(
          document.getElementById("amount").value
        );


      const note =
        document
          .getElementById("note")
          .value
          .trim();


      if (!receiverAccountNumber) {

        message.className = "error";
        message.textContent =
          "❌ أدخل رقم حساب المستلم.";

        return;
      }


      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {

        message.className = "error";
        message.textContent =
          "❌ أدخل مبلغًا صحيحًا.";

        return;
      }


      if (
        Math.round(amount * 100) !==
        amount * 100
      ) {

        message.className = "error";
        message.textContent =
          "❌ المبلغ يجب ألا يحتوي على أكثر من منزلتين عشريتين.";

        return;
      }


      button.disabled = true;
      button.textContent = "⏳ جارٍ تنفيذ التحويل...";


      try {

        const result =
          await transferMoney({

            receiverAccountNumber:
              receiverAccountNumber,

            amount: amount,

            note: note

          });


        message.className = "success";

        message.textContent =
          "✅ " +
          (result.data.message ||
           "تم التحويل بنجاح.");


        form.reset();


      } catch (error) {

        console.error(error);

        message.className = "error";


        const code =
          error?.code || "";


        if (
          code.includes("unauthenticated")
        ) {

          message.textContent =
            "❌ انتهت جلسة تسجيل الدخول. سجّل الدخول مرة أخرى.";

        } else if (
          code.includes("not-found")
        ) {

          message.textContent =
            "❌ حساب المستلم غير موجود.";

        } else if (
          code.includes("failed-precondition")
        ) {

          message.textContent =
            "❌ " +
            (error.message ||
             "تعذر تنفيذ التحويل.");

        } else if (
          code.includes("invalid-argument")
        ) {

          message.textContent =
            "❌ بيانات التحويل غير صحيحة.";

        } else {

          message.textContent =
            "❌ حدث خطأ أثناء تنفيذ التحويل.";

          console.error(
            "تفاصيل الخطأ:",
            error
          );

        }

      } finally {

        button.disabled = false;
        button.textContent = "تحويل الأموال";

      }

    });

  </script>

</body>
</html>
