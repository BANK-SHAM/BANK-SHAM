<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم الإدارية - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 40px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 520px;
  margin: auto;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.admin-header {
  text-align: center;
  margin-bottom: 24px;
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.3);
  padding: 16px;
  border-radius: 20px;
}

.admin-title {
  font-size: 18px;
  font-weight: 900;
  color: var(--error);
  margin-bottom: 4px;
}

.admin-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.section-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 20px;
  border-radius: 22px;
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

.section-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--accent-color);
}

.form-group {
  margin-bottom: 14px;
  text-align: right;
}

.form-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 5px;
  display: block;
}

.form-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--card-border);
  padding: 12px;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.form-input:focus {
  border-color: var(--accent-color);
}

.btn-admin {
  width: 100%;
  background: linear-gradient(135deg, #5278dc, #3b5cb8);
  border: none;
  color: #fff;
  padding: 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 5px;
}

.btn-admin:hover { filter: brightness(1.05); }

/* جدول الطلبات */
.request-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--card-border);
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.req-info { font-size: 13px; }
.req-name { font-weight: 700; margin-bottom: 3px; }
.req-meta { font-size: 11px; color: var(--text-muted); }

.req-actions { display: flex; gap: 6px; }
.btn-approve { background: var(--success); color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; }
.btn-reject { background: var(--error); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; }

.back-link {
  text-align: center;
  margin-top: 20px;
}
.back-link a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
}
.back-link a:hover { color: #fff; }
</style>
</head>
<body>

<div class="page">
  <div class="admin-header">
    <div class="admin-title">🛡️ لوحة التحكم الإدارية العليا</div>
    <div class="admin-subtitle">إدارة إعدادات الموقع، الألوان، الطلبات ورصيد المستخدمين</div>
  </div>

  <!-- قسم تخصيص الهوية والمظهر -->
  <div class="section-box">
    <div class="section-title">🎨 تخصيص الهوية والمظهر العام</div>
    <form onsubmit="saveBranding(event)">
      <div class="form-group">
        <label class="form-label">اسم البنك الجديد</label>
        <input type="text" id="brandNameInput" class="form-input" placeholder="BANK SHAM">
      </div>
      <div class="form-group">
        <label class="form-label">رمز الشعار (Logo Text)</label>
        <input type="text" id="brandLogoInput" class="form-input" placeholder="BS" maxlength="3">
      </div>
      <div class="form-group">
        <label class="form-label">اللون الرئيسي للبراند (Accent Color)</label>
        <input type="color" id="brandColorInput" class="form-input" value="#5278dc" style="height: 45px; padding: 4px; cursor: pointer;">
      </div>
      <button type="submit" class="btn-admin">حفظ وتطبيق التعديلات على الموقع</button>
    </form>
  </div>

  <!-- قسم إدارة طلبات التعبئة -->
  <div class="section-box">
    <div class="section-title">📥 طلبات تعبئة الرصيد المعلقة</div>
    <div id="adminRequestsList">
      <div style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 10px;">لا توجد طلبات تعبئة معلقة حالياً</div>
    </div>
  </div>

  <div class="back-link">
    <a href="dashboard.html">← العودة إلى لوحة التحكم الرئيسية</a>
  </div>
</div>

<script>
window.onload = function() {
  // تحميل إعدادات الهوية الحالية إن وجدت
  document.getElementById('brandNameInput').value = localStorage.getItem('customBrandName') || 'BANK SHAM';
  document.getElementById('brandLogoInput').value = localStorage.getItem('customBrandLogo') || 'BS';
  document.getElementById('brandColorInput').value = localStorage.getItem('customBrandColor') || '#5278dc';
  
  loadAdminRequests();
};

// حفظ إعدادات الهوية والتعديلات
function saveBranding(e) {
  e.preventDefault();
  const name = document.getElementById('brandNameInput').value.trim();
  const logo = document.getElementById('brandLogoInput').value.trim();
  const color = document.getElementById('brandColorInput').value;

  localStorage.setItem('customBrandName', name);
  localStorage.setItem('customBrandLogo', logo);
  localStorage.setItem('customBrandColor', color);

  alert('تم تحديث إعدادات وهويات الموقع بنجاح!');
}

// عرض الطلبات (يتم ربطها بطلبات المستخدمين)
function loadAdminRequests() {
  // كمثال تجريبي تفاعلي، يمكنك تفعيل محاكاة قراءة الطلبات هنا
  const listContainer = document.getElementById('adminRequestsList');
  // ملاحظة: النظام سحب الطلبات من الـ localStorage إذا أردت ربطها بـ dashboard
}
</script>

</body>
</html>
