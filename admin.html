<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة BANK SHAM</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:Arial,sans-serif;
  color:#fff;
  background:linear-gradient(135deg,#07111f,#10243b)
}

.card{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:28px 22px;
  border-radius:24px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 50px rgba(0,0,0,.35)
}

h1{text-align:center}
.subtitle{
  text-align:center;
  color:#aab8c8;
  margin-bottom:25px
}

label{
  display:block;
  margin:16px 0 8px
}

input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.25);
  color:#fff;
  font-size:16px;
  outline:0
}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#1479ff,#00b7ff);
  color:#fff;
  font-size:17px;
  font-weight:bold
}

#message{
  margin-top:18px;
  text-align:center;
  line-height:1.7
}

.success{color:#5cff9d}
.error{color:#ff7373}

.info{
  margin-top:20px;
  padding:16px;
  border-radius:15px;
  background:rgba(0,0,0,.22);
  line-height:2
}
</style>
</head>

<body>

<div class="card">

<h1>🏦 لوحة إدارة BANK SHAM</h1>

<div class="subtitle">
إدارة أرصدة الحسابات
</div>

<div id="message">
جاري التحقق من صلاحيات المدير...
</div>

<div id="adminPanel" style="display:none">

<label>رقم حساب العميل</label>

<input
  id="accountNumber"
  type="text"
  placeholder="مثال: BS-2026-169261"
>

<button id="searchBtn">
البحث عن الحساب
</button>

<div id="accountInfo"></div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",

  authDomain:
    "ahmad-662ee.firebaseapp.com",

  projectId:
    "ahmad-662ee",

  storageBucket:
    "ahmad-662ee.firebasestorage.app",

  messagingSenderId:
    "740891153734",

  appId:
    "1:740891153734:web:80d3fd406214929c618147"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const ADMIN_UID =
  "lTocNclvlrbmSYQostZag7FKNME2";


const message =
  document.getElementById("message");

const adminPanel =
  document.getElementById("adminPanel");

const searchBtn =
  document.getElementById("searchBtn");

const accountInfo =
  document.getElementById("accountInfo");


onAuthStateChanged(
  auth,
  (user)=>{

    if(!user){

      message.className =
        "error";

      message.textContent =
        "❌ يجب تسجيل الدخول أولاً.";

      return;
    }


    if(user.uid !== ADMIN_UID){

      message.className =
        "error";

      message.textContent =
        "❌ ليس لديك صلاحية دخول لوحة الإدارة.";

      return;
    }


    message.className =
      "success";

    message.textContent =
      "✅ تم التحقق من صلاحيات المدير.";

    adminPanel.style.display =
      "block";

  }
);


searchBtn.addEventListener(
  "click",
  async()=>{

    const accountNumber =
      document
        .getElementById("accountNumber")
        .value
        .trim();


    if(!accountNumber){

      accountInfo.innerHTML =
        `<div class="error">
          ❌ أدخل رقم الحساب.
        </div>`;

      return;
    }


    searchBtn.disabled = true;

    searchBtn.textContent =
      "جاري البحث...";


    try{

      const q =
        query(
          collection(db,"users"),
          where(
            "accountNumber",
            "==",
            accountNumber
          )
        );


      const snapshot =
        await getDocs(q);


      if(snapshot.empty){

        accountInfo.innerHTML =
          `<div class="error">
            ❌ الحساب غير موجود.
          </div>`;

        return;
      }


      const data =
        snapshot.docs[0].data();


      accountInfo.innerHTML = `

        <div class="info">

          🏦 <b>رقم الحساب:</b>
          ${data.accountNumber || "-"}

          <br>

          💰 <b>الرصيد:</b>
          ${data.balance ?? 0}

          <br>

          💱 <b>العملة:</b>
          ${data.currency || "-"}

        </div>

      `;


    }catch(error){

      console.error(error);

      accountInfo.innerHTML =
        `<div class="error">
          ❌ تعذر قراءة بيانات الحساب.
        </div>`;

    }finally{

      searchBtn.disabled =
        false;

      searchBtn.textContent =
        "البحث عن الحساب";

    }

  }
);

</script>

</body>
</html>
