<script type="module">

import {

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain:"ahmad-662ee.firebaseapp.com",
    projectId:"ahmad-662ee",
    storageBucket:"ahmad-662ee.firebasestorage.app",
    messagingSenderId:"740891153734",
    appId:"1:740891153734:web:80d3fd406214929c618147"
};


/* =========================
   FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
    "lTocNclvlrbmSYQostZag7FKNME2";


/* =========================
   ELEMENTS
========================= */

const adminLogin =
    document.getElementById("adminLogin");

const adminPanel =
    document.getElementById("adminPanel");

const loginMessage =
    document.getElementById("loginMessage");

const message =
    document.getElementById("message");

const requestsBox =
    document.getElementById("requests");

const verificationRequestsBox =
    document.getElementById("verificationRequests");

const verificationMessage =
    document.getElementById("verificationMessage");

const loginBtn =
    document.getElementById("loginBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsSection =
    document.getElementById("settingsSection");

const checkAccountBtn =
    document.getElementById("checkAccountBtn");

const addAmountBtn =
    document.getElementById("addAmountBtn");

const manualMessage =
    document.getElementById("manualMessage");

const currentBalanceBox =
    document.getElementById("currentBalanceBox");


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener("click", async () => {

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    if (!email || !password) {

        loginMessage.className = "error";

        loginMessage.textContent =
            "❌ أدخل البريد الإلكتروني وكلمة المرور.";

        return;
    }

    loginBtn.disabled = true;

    loginMessage.textContent =
        "⏳ جارٍ تسجيل الدخول...";

    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        if (result.user.uid !== ADMIN_UID) {

            await signOut(auth);

            loginMessage.className =
                "error";

            loginMessage.textContent =
                "❌ هذا الحساب ليس حساب المدير.";

            loginBtn.disabled = false;

            return;
        }

        loginMessage.className =
            "success";

        loginMessage.textContent =
            "✅ تم تسجيل دخول المدير.";

    } catch (error) {

        console.error(error);

        loginMessage.className =
            "error";

        loginMessage.textContent =
            "❌ فشل تسجيل الدخول.";
    }

    loginBtn.disabled = false;
});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        adminLogin.style.display =
            "block";

        adminPanel.style.display =
            "none";

        return;
    }

    if (user.uid !== ADMIN_UID) {

        await signOut(auth);

        adminLogin.style.display =
            "block";

        adminPanel.style.display =
            "none";

        loginMessage.className =
            "error";

        loginMessage.textContent =
            "❌ هذا الحساب ليس حساب المدير.";

        return;
    }

    adminLogin.style.display =
        "none";

    adminPanel.style.display =
        "block";

    loadSavedSettings();

    await loadRequests();

    await loadVerificationRequests();
});


/* ==================================================
   LOAD VERIFICATION REQUESTS
================================================== */

async function loadVerificationRequests() {

    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID) {

        verificationMessage.className =
            "error";

        verificationMessage.textContent =
            "❌ غير مصرح بالدخول.";

        return;
    }

    verificationMessage.className = "";

    verificationMessage.textContent =
        "⏳ جارٍ تحميل طلبات التوثيق...";

    verificationRequestsBox.innerHTML = "";

    try {

        const q =
            query(
                collection(
                    db,
                    "verificationRequests"
                ),
                where(
                    "status",
                    "==",
                    "pending"
                )
            );


        const snapshot =
            await getDocs(q);


        if (snapshot.empty) {

            verificationMessage.className = "";

            verificationMessage.textContent =
                "لا توجد طلبات توثيق معلقة حاليًا.";

            verificationRequestsBox.innerHTML =
                `
                <div class="empty-box">
                    🪪 لا توجد طلبات توثيق جديدة.
                </div>
                `;

            return;
        }


        verificationMessage.className =
            "success";

        verificationMessage.textContent =
            `تم العثور على ${snapshot.size} طلب توثيق.`;


        snapshot.forEach((item) => {

            renderVerificationRequest(
                item.id,
                item.data()
            );

        });

    } catch (error) {

        console.error(error);

        verificationMessage.className =
            "error";

        verificationMessage.textContent =
            "❌ تعذر تحميل طلبات التوثيق.";

    }
}


/* ==================================================
   RENDER VERIFICATION REQUEST
================================================== */

function renderVerificationRequest(
    id,
    request
) {

    const card =
        document.createElement("div");

    card.className =
        "verification-card";


    let date =
        "غير متوفر";


    if (request.createdAt) {

        try {

            date =
                new Date(
                    request.createdAt.seconds
                        ? request.createdAt.seconds * 1000
                        : request.createdAt
                ).toLocaleString("ar-SA");

        } catch {

            date =
                "غير متوفر";
        }
    }


    card.innerHTML = `

        <h3>
            🪪 طلب توثيق هوية
        </h3>

        <div class="row">
            <span class="label">
                رقم الطلب
            </span>

            <span class="value">
                ${id}
            </span>
        </div>

        <div class="row">
            <span class="label">
                رقم الحساب
            </span>

            <span class="value">
                ${request.accountNumber || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">
                الاسم
            </span>

            <span class="value">
                ${request.name || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">
                البريد الإلكتروني
            </span>

            <span class="value">
                ${request.email || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">
                تاريخ الطلب
            </span>

            <span class="value">
                ${date}
            </span>
        </div>

        <div class="verification-image-title">
            📷 صورة الهوية
        </div>

        ${
            request.identityImage
            ? `
                <img
                    class="identity-image"
                    src="${request.identityImage}"
                    alt="صورة الهوية"
                >
            `
            :
            `
                <div class="empty-box">
                    ❌ لا توجد صورة هوية.
                </div>
            `
        }

        <div class="status">
            ⏳ طلب توثيق قيد المراجعة
        </div>

        <div class="actions">

            <button
                class="approve"
                data-id="${id}"
            >
                ✅ موافقة
            </button>

            <button
                class="reject"
                data-id="${id}"
            >
                ❌ رفض
            </button>

        </div>
    `;


    card
        .querySelector(".approve")
        .addEventListener(
            "click",
            () => approveVerification(id)
        );


    card
        .querySelector(".reject")
        .addEventListener(
            "click",
            () => rejectVerification(id)
        );


    verificationRequestsBox.appendChild(card);
}


/* ==================================================
   APPROVE VERIFICATION
================================================== */

async function approveVerification(id) {

    if (!confirm(
        "هل تريد الموافقة على توثيق هذا الحساب؟"
    )) {
        return;
    }


    try {

        const requestRef =
            doc(
                db,
                "verificationRequests",
                id
            );


        await runTransaction(
            db,
            async (transaction) => {

                const requestSnap =
                    await transaction.get(
                        requestRef
                    );


                if (!requestSnap.exists()) {

                    throw new Error(
                        "REQUEST_NOT_FOUND"
                    );
                }


                const requestData =
                    requestSnap.data();


                if (
                    requestData.status
                    !== "pending"
                ) {

                    throw new Error(
                        "REQUEST_ALREADY_PROCESSED"
                    );
                }


                transaction.update(
                    requestRef,
                    {
                        status: "approved"
                    }
                );

            }
        );


        alert(
            "✅ تمت الموافقة على توثيق الحساب."
        );


        await loadVerificationRequests();


    } catch (error) {

        console.error(error);

        if (
            error.message
            === "REQUEST_ALREADY_PROCESSED"
        ) {

            alert(
                "⚠️ تمت معالجة هذا الطلب مسبقًا."
            );

        } else {

            alert(
                "❌ فشلت الموافقة على طلب التوثيق."
            );
        }
    }
}


/* ==================================================
   REJECT VERIFICATION
================================================== */

async function rejectVerification(id) {

    if (!confirm(
        "هل تريد رفض طلب توثيق هذا الحساب؟"
    )) {
        return;
    }


    try {

        const requestRef =
            doc(
                db,
                "verificationRequests",
                id
            );


        await runTransaction(
            db,
            async (transaction) => {

                const requestSnap =
                    await transaction.get(
                        requestRef
                    );


                if (!requestSnap.exists()) {

                    throw new Error(
                        "REQUEST_NOT_FOUND"
                    );
                }


                const requestData =
                    requestSnap.data();


                if (
                    requestData.status
                    !== "pending"
                ) {

                    throw new Error(
                        "REQUEST_ALREADY_PROCESSED"
                    );
                }


                transaction.update(
                    requestRef,
                    {
                        status: "rejected"
                    }
                );

            }
        );


        alert(
            "✅ تم رفض طلب توثيق الحساب."
        );


        await loadVerificationRequests();


    } catch (error) {

        console.error(error);

        if (
            error.message
            === "REQUEST_ALREADY_PROCESSED"
        ) {

            alert(
                "⚠️ تمت معالجة هذا الطلب مسبقًا."
            );

        } else {

            alert(
                "❌ فشل رفض طلب التوثيق."
            );
        }
    }
}


/* ==================================================
   LOAD DEPOSIT REQUESTS
================================================== */

async function loadRequests() {

    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID) {

        message.className =
            "error";

        message.textContent =
            "❌ غير مصرح بالدخول.";

        return;
    }

    message.className = "";

    message.textContent =
        "⏳ جارٍ تحميل طلبات الإيداع...";

    requestsBox.innerHTML = "";

    try {

        const q = query(
            collection(db, "transferRequests"),
            where("status", "==", "pending")
        );

        const snapshot =
            await getDocs(q);

        if (snapshot.empty) {

            message.textContent =
                "لا توجد طلبات إيداع معلقة حاليًا.";

            return;
        }

        message.className =
            "success";

        message.textContent =
            `تم العثور على ${snapshot.size} طلب.`;

        snapshot.forEach((item) => {

            renderRequest(
                item.id,
                item.data()
            );

        });

    } catch (error) {

        console.error(error);

        message.className =
            "error";

        message.textContent =
            "❌ تعذر تحميل طلبات الإيداع.";
    }
}

        </div>

        <div class="actions">

            <button
                class="approve"

            >
                ✅ موافقة
            </button>

            <button
                class="reject"
                data-id="${id}"
            >
                ❌ رفض
            </button>

        </div>
    `;


    card
        .querySelector(".approve")
        .addEventListener(
            "click",
            () => approveRequest(id, request)
        );


    card
        .querySelector(".reject")
        .addEventListener(
            "click",
            () => rejectRequest(id)
        );


    requestsBox.appendChild(card);
}


/* ==================================================
   APPROVE DEPOSIT
================================================== */

async function approveRequest(id, request) {

    if (!confirm(
        "هل تريد الموافقة على الإيداع وإضافة المبلغ إلى رصيد الحساب؟"
    )) {
        return;
    }


    const amount =
        Number(request.amount);


    const accountNumber =
        String(request.accountNumber || "").trim();


    if (!accountNumber) {

        alert(
            "❌ رقم الحساب غير موجود."
        );

        return;
    }


    if (!Number.isFinite(amount) || amount <= 0) {

        alert(
            "❌ مبلغ الإيداع غير صالح."
        );

        return;
    }


    try {

        const usersQuery =
            query(
                collection(db, "users"),
                where(
                    "accountNumber",
                    "==",
                    accountNumber
                )
            );


        const usersSnapshot =
            await getDocs(usersQuery);


        if (usersSnapshot.empty) {

            alert(
                "❌ لم يتم العثور على الحساب."
            );

            return;
        }


        if (usersSnapshot.size > 1) {

            alert(
                "❌ يوجد أكثر من حساب بنفس رقم الحساب."
            );

            return;
        }


        const userDoc =
            usersSnapshot.docs[0];


        const userRef =
            doc(
                db,
                "users",
                userDoc.id
            );


        const requestRef =
            doc(
                db,
                "transferRequests",
                id
            );


        await runTransaction(
            db,
            async (transaction) => {

                const requestSnap =
                    await transaction.get(
                        requestRef
                    );


                if (!requestSnap.exists()) {

                    throw new Error(
                        "REQUEST_NOT_FOUND"
                    );
                }


                const currentRequest =
                    requestSnap.data();


                if (
                    currentRequest.status
                    !== "pending"
                ) {

                    throw new Error(
                        "REQUEST_ALREADY_PROCESSED"
                    );
                }


                const userSnap =
                    await transaction.get(
                        userRef
                    );


                if (!userSnap.exists()) {

                    throw new Error(
                        "USER_NOT_FOUND"
                    );
                }


                const userData =
                    userSnap.data();


                const currentBalance =
                    Number(
                        userData.balance || 0
                    );


                const newBalance =
                    currentBalance + amount;


                transaction.update(
                    userRef,
                    {
                        balance: newBalance
                    }
                );


                transaction.update(
                    requestRef,
                    {
                        status: "approved"
                    }
                );

            }
        );


        alert(
            "✅ تمت الموافقة على الإيداع وتمت إضافة المبلغ."
        );


        await loadRequests();


    } catch (error) {

        console.error(error);

        alert(
            "❌ فشلت الموافقة على الإيداع."
        );
    }
}


/* ==================================================
   REJECT DEPOSIT
================================================== */

async function rejectRequest(id) {

    if (!confirm(
        "هل تريد رفض طلب الإيداع؟"
    )) {
        return;
    }


    try {

        const requestRef =
            doc(
                db,
                "transferRequests",
                id
            );


        await runTransaction(
            db,
            async (transaction) => {

                const requestSnap =
                    await transaction.get(
                        requestRef
                    );


                if (!requestSnap.exists()) {

                    throw new Error(
                        "REQUEST_NOT_FOUND"
                    );
                }


                const requestData =
                    requestSnap.data();


                if (
                    requestData.status
                    !== "pending"
                ) {

                    throw new Error(
                        "REQUEST_ALREADY_PROCESSED"
                    );
                }


                transaction.update(
                    requestRef,
                    {
                        status: "rejected"
                    }
                );

            }
        );


        alert(
            "✅ تم رفض طلب الإيداع."
        );


        await loadRequests();


    } catch (error) {

        console.error(error);

        alert(
            "❌ فشل رفض الطلب."
        );
    }
}

                    collection(db, "users"),
                    where(
                        "accountNumber",

        } catch (error) {

/* ==================================================
   ADD MANUAL AMOUNT
================================================== */

addAmountBtn.addEventListener(
    "click",
    async () => {

        const accountNumber =
            document
                .getElementById("manualAccount")
                .value
                .trim();


        const amount =
            Number(
                document
                    .getElementById("manualAmount")
                    .value
            );


        const currency =
            document
                .getElementById("manualCurrency")
                .value;


        if (!accountNumber) {

            manualMessage.className =
                "error";

            manualMessage.textContent =
                "❌ أدخل رقم الحساب.";

            return;
        }


        if (
            !Number.isFinite(amount)
            || amount <= 0
            || amount > 1000000000
        ) {

            manualMessage.className =
                "error";

            manualMessage.textContent =
                "❌ أدخل مبلغًا صحيحًا.";

            return;
        }


        if (!confirm(
            `هل تريد إضافة ${amount} ${currency} إلى الحساب ${accountNumber}؟`
        )) {
            return;
        }


        addAmountBtn.disabled = true;

        manualMessage.className = "";

        manualMessage.textContent =
            "⏳ جارٍ إضافة المبلغ...";


        try {

            const q =
                query(
                    collection(db, "users"),
                    where(
                        "accountNumber",
                        "==",
                        accountNumber
                    )
                );


            const snapshot =
                await getDocs(q);


            if (snapshot.empty) {

                throw new Error(
                    "USER_NOT_FOUND"
                );
            }


            if (snapshot.size > 1) {

                throw new Error(
                    "DUPLICATE_ACCOUNT"
                );
            }


            const userDoc =
                snapshot.docs[0];


            const userRef =
                doc(
                    db,
                    "users",
                    userDoc.id
                );


            await runTransaction(
                db,
                async (transaction) => {

                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    if (!userSnap.exists()) {

                        throw new Error(
                            "USER_NOT_FOUND"
                        );
                    }


                    const data =
                        userSnap.data();


                    const oldBalance =
                        Number(
                            data.balance || 0
                        );


                    const newBalance =
                        oldBalance + amount;


                    transaction.update(
                        userRef,
                        {
                            balance: newBalance,
                            currency: currency
                        }
                    );

                }
            );


            manualMessage.className =
                "success";

            manualMessage.textContent =
                `✅ تمت إضافة ${amount.toLocaleString("ar-SA")} ${currency} بنجاح.`;


            document
                .getElementById("manualAmount")
                .value = "";


            currentBalanceBox.style.display =
                "block";


            currentBalanceBox.textContent =
                `الرصيد الجديد تمت إضافته بنجاح.`;


        } catch (error) {

            console.error(error);

            manualMessage.className =
                "error";

            if (
                error.message
                === "USER_NOT_FOUND"
            ) {

                manualMessage.textContent =
                    "❌ الحساب غير موجود.";

            } else if (
                error.message
                === "DUPLICATE_ACCOUNT"
            ) {

                manualMessage.textContent =
                    "❌ يوجد أكثر من حساب بنفس الرقم.";

            } else {

                manualMessage.textContent =
                    "❌ فشلت إضافة المبلغ.";
            }

        } finally {

            addAmountBtn.disabled =
                false;
        }
    }
);

/* ==================================================

================================================== */

function loadSavedSettings() {

    const savedName =
        localStorage.getItem(
            "bankShamSiteName"
        );

    const savedDescription =
        localStorage.getItem(
            "bankShamSiteDescription"
        );


    if (savedName) {

        document.getElementById(
            "siteTitle"
        ).textContent =
            "🏦 " + savedName;

        document.getElementById(
            "siteNameInput"
        ).value =
            savedName;
    }


    if (savedDescription) {

        document.getElementById(
            "siteDescription"
        ).textContent =
            savedDescription;

        document.getElementById(
            "siteDescriptionInput"
        ).value =
            savedDescription;
    }

}
