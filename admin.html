<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة BANK SHAM</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07131f;
    color:white;
}

.header{
    padding:22px;
    background:#0b1928;
    border-bottom:1px solid rgba(25,211,174,.2);
    text-align:center;
}

.header h1{
    margin:0;
    color:#19d3ae;
}

.header p{
    color:#8192a6;
    margin:8px 0 0;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:20px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-weight:900;
    cursor:pointer;
}

.refresh{
    background:#19d3ae;
    color:#07131f;
}

.logout{
    background:#18293a;
    color:white;
}

#message{
    text-align:center;
    color:#8192a6;
    margin:20px 0;
}

.request{
    background:#0b1928;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
}

.request h3{
    margin:0 0 12px;
    color:#19d3ae;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.label{
    color:#8192a6;
}

.value{
    font-weight:800;
    word-break:break-all;
}

.proof{
    width:100%;
    max-height:400px;
    object-fit:contain;
    margin-top:14px;
    border-radius:14px;
    background:#101f30;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.approve{
    flex:1;
    background:#19d3ae;
    color:#07131f;
}

.reject{
    flex:1;
    background:#c0392b;
    color:white;
}

.status{
    margin-top:12px;
    text-align:center;
    padding:9px;
    border-radius:10px;
    background:rgba(255,255,255,.05);
}

.login{
    width:100%;
    max-width:420px;
    margin:40px auto;
    padding:25px;
    background:#0b1928;
    border:1px solid rgba(25,211,174,.2);
    border-radius:22px;
}

.login h2{
    margin-top:0;
    color:#19d3ae;
    text-align:center;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:#101f30;
    color:white;
    font-size:16px;
}

.login button{
    width:100%;
    background:#19d3ae;
    color:#07131f;
}

.success{
    color:#19d3ae !important;
}

.error{
    color:#ff6b6b !important;
}
</style>
</head>

<body>

<div class="header">
    <h1>🏦 BANK SHAM</h1>
    <p>لوحة إدارة طلبات الإيداع</p>
</div>

<div id="adminLogin" class="login">

    <h2>🔐 دخول المدير</h2>

    <input
        id="adminEmail"
        type="email"
        placeholder="البريد الإلكتروني"
    >

    <input
        id="adminPassword"
        type="password"
        placeholder="كلمة المرور"
    >

    <button id="loginBtn">
        🔑 دخول لوحة الإدارة
    </button>

    <div id="loginMessage"
         style="text-align:center;margin-top:12px;color:#8192a6;">
    </div>

</div>


<div id="adminPanel" style="display:none;">

    <div class="container">

        <div class="toolbar">

            <button class="refresh" id="refreshBtn">
                🔄 تحديث الطلبات
            </button>

            <button class="logout" id="logoutBtn">
                تسجيل الخروج
            </button>

        </div>

        <div id="message">
            ⏳ جارٍ تحميل الطلبات...
        </div>

        <div id="requests"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain:"ahmad-662ee.firebaseapp.com",
    projectId:"ahmad-662ee",
    storageBucket:"ahmad-662ee.firebasestorage.app",
    messagingSenderId:"740891153734",
    appId:"1:740891153734:web:80d3fd406214929c618147"
};


/* =========================
   FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
    "lTocNclvlrbmSYQostZag7FKNME2";


/* =========================
   ELEMENTS
========================= */

const adminLogin =
    document.getElementById("adminLogin");

const adminPanel =
    document.getElementById("adminPanel");

const loginMessage =
    document.getElementById("loginMessage");

const message =
    document.getElementById("message");

const requestsBox =
    document.getElementById("requests");

const loginBtn =
    document.getElementById("loginBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const logoutBtn =
    document.getElementById("logoutBtn");


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener("click", async () => {

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    if (!email || !password) {

        loginMessage.className = "error";

        loginMessage.textContent =
            "❌ أدخل البريد الإلكتروني وكلمة المرور.";

        return;
    }

    loginBtn.disabled = true;

    loginMessage.className = "";

    loginMessage.textContent =
        "⏳ جارٍ تسجيل الدخول...";

    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        if (result.user.uid !== ADMIN_UID) {

            await signOut(auth);

            loginMessage.className =
                "error";

            loginMessage.textContent =
                "❌ هذا الحساب ليس حساب المدير.";

            return;
        }

        loginMessage.className =
            "success";

        loginMessage.textContent =
            "✅ تم تسجيل دخول المدير.";

    } catch (error) {

        console.error(error);

        loginMessage.className =
            "error";

        loginMessage.textContent =
            "❌ فشل تسجيل الدخول.";
    }

    loginBtn.disabled = false;
});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        adminLogin.style.display =
            "block";

        adminPanel.style.display =
            "none";

        return;
    }

    if (user.uid !== ADMIN_UID) {

        await signOut(auth);

        adminLogin.style.display =
            "block";

        adminPanel.style.display =
            "none";

        loginMessage.className =
            "error";

        loginMessage.textContent =
            "❌ هذا الحساب ليس حساب المدير.";

        return;
    }

    adminLogin.style.display =
        "none";

    adminPanel.style.display =
        "block";

    await loadRequests();
});


/* =========================
   LOAD DEPOSIT REQUESTS
========================= */

async function loadRequests() {

    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID) {

        message.className =
            "error";

        message.textContent =
            "❌ غير مصرح بالدخول.";

        return;
    }

    message.className = "";

    message.textContent =
        "⏳ جارٍ تحميل طلبات الإيداع...";

    requestsBox.innerHTML = "";

    try {

        /*
         * طلبات الإيداع موجودة في
         * transferRequests
         */

        const q = query(
            collection(db, "transferRequests"),
            where("status", "==", "pending")
        );

        const snapshot =
            await getDocs(q);

        if (snapshot.empty) {

            message.textContent =
                "لا توجد طلبات إيداع معلقة حاليًا.";

            return;
        }

        message.className =
            "success";

        message.textContent =
            `تم العثور على ${snapshot.size} طلب.`;

        snapshot.forEach((doc) => {

            renderRequest(
                doc.id,
                doc.data()
            );

        });

    } catch (error) {

        console.error(error);

        message.className =
            "error";

        message.textContent =
            "❌ تعذر تحميل طلبات الإيداع.";
    }
}


/* =========================
   RENDER REQUEST
========================= */

function renderRequest(id, request) {

    const card =
        document.createElement("div");

    card.className =
        "request";


    let date =
        "غير متوفر";

    if (request.createdAt) {

        try {

            date =
                new Date(
                    request.createdAt.seconds
                        ? request.createdAt.seconds * 1000
                        : request.createdAt
                ).toLocaleString("ar-SA");

        } catch {

            date =
                "غير متوفر";
        }
    }


    const amount =
        Number(
            request.amount || 0
        ).toLocaleString("ar-SA");


    card.innerHTML = `

        <h3>
            💚 طلب إيداع شام كاش
        </h3>

        <div class="row">
            <span class="label">
                رقم الطلب
            </span>

            <span class="value">
                ${id}
            </span>
        </div>

        <div class="row">
            <span class="label">
                رقم العملية
            </span>

            <span class="value">
                ${request.operationNumber || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">
                رقم الحساب
            </span>

            <span class="value">
                ${request.accountNumber || "—"}
            </span>
        </div>

        <div class="row">
            <span class="label">
                المبلغ
            </span>

            <span class="value">
                ${amount}
                ${request.currency || "USD"}
            </span>
        </div>

        <div class="row">
            <span class="label">
                التاريخ
            </span>

            <span class="value">
                ${date}
            </span>
        </div>

        ${
            request.proofImage
            ? `
                <img
                    class="proof"
                    src="${request.proofImage}"
                    alt="إثبات التحويل"
                >
            `
            : ""
        }

        <div class="status">
            ⏳ قيد المراجعة
        </div>

        <div class="actions">

            <button
                class="approve"
                data-id="${id}"
            >
                ✅ موافقة
            </button>

            <button
                class="reject"
                data-id="${id}"
            >
                ❌ رفض
            </button>

        </div>
    `;


    card
        .querySelector(".approve")
        .addEventListener(
            "click",
            () => approveRequest(id)
        );


    card
        .querySelector(".reject")
        .addEventListener(
            "click",
            () => rejectRequest(id)
        );


    requestsBox.appendChild(card);
}


/* =========================
   APPROVE
========================= */


async function rejectRequest(id) {

    if (!confirm("هل تريد رفض طلب الإيداع؟")) {
        return;
    }

    try {

        const { doc, updateDoc } =
            await import(
                "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
            );

        await updateDoc(
            doc(db, "transferRequests", id),
            {
                status: "rejected"
            }
        );

        alert("✅ تم رفض طلب الإيداع.");

        await loadRequests();

    } catch (error) {

        console.error(error);

        alert(
            "❌ فشل رفض الطلب."
        );
    }
}

/* =========================
   REJECT
========================= */

async function rejectRequest(id) {

    alert(
        "تم تجهيز زر الرفض، وسنربطه بتحديث الطلب في الخطوة التالية."
    );
}


/* =========================
   REFRESH
========================= */

refreshBtn.addEventListener(
    "click",
    loadRequests
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

        location.reload();

    }
);

</script>

</body>
</html>
