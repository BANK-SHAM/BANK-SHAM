<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - محفظة إدلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        /* الشريط العلوي الخاص بالإدارة */
        .admin-header {
            background: #111827;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h2 {
            font-size: 18px;
        }
        .admin-badge {
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        /* حاوية اللوحة */
        .container {
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        /* إحصائيات سريعة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            text-align: center;
        }
        .stat-card span {
            font-size: 13px;
            color: #666;
        }
        .stat-card h3 {
            font-size: 20px;
            color: #111827;
            margin-top: 5px;
            font-weight: 900;
        }

        /* جدول العمليات المعلقة */
        .section-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        .section-box h3 {
            font-size: 16px;
            color: #111827;
            margin-bottom: 15px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 8px;
        }
        
        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f4f7f6;
            font-size: 14px;
        }
        .request-item:last-child {
            border-bottom: none;
        }
        .req-info p {
            font-weight: 700;
            color: #333;
        }
        .req-info span {
            font-size: 12px;
            color: #777;
        }
        
        /* أزرار الموافقة والرفض */
        .req-actions {
            display: flex;
            gap: 5px;
        }
        .btn-accept {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-reject {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي للإدارة -->
    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <h2>لوحة الإدارة المركزية</h2>
            <span class="admin-badge">مدير النظام</span>
        </div>
        <a href="dashboard.html" style="color: #fff; text-decoration: none; font-size: 13px;">خروج</a>
    </header>

    <div class="container">
        
        <!-- إحصائيات سريعة -->
        <div class="stats-grid">
            <div class="stat-card">
                <span>إجمالي المستخدمين</span>
                <h3>1,240</h3>
            </div>
            <div class="stat-card">
                <span>السيولة الكلية</span>
                <h3>$84,500</h3>
            </div>
        </div>

        <!-- طلبات شحن الرصيد المعلقة -->
        <div class="section-box">
            <h3>طلبات شحن الرصيد المعلقة (3)</h3>
            
            <div class="request-item">
                <div class="req-info">
                    <p>أحمد خالد - مبلغ: $300</p>
                    <span>عبر وكيل إدلب - منذ 10 دقائق</span>
                </div>
                <div class="req-actions">
                    <button class="btn-accept">موافقة</button>
                    <button class="btn-reject">رفض</button>
                </div>
            </div>

            <div class="request-item">
                <div class="req-info">
                    <p>عمر السعيد - مبلغ: $150</p>
                    <span>عبر تحويل داخلي - منذ 25 دقيقة</span>
                </div>
                <div class="req-actions">
                    <button class="btn-accept">موافقة</button>
                    <button class="btn-reject">رفض</button>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
