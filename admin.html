<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الأدمن - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 20px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.title {
  font-size: 18px;
  font-weight: 900;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.card-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

.section-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
  color: var(--accent-color);
}

.user-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--card-border);
  padding: 12px 16px;
  border-radius: 14px;
  margin-bottom: 10px;
}

.user-info div {
  font-size: 13px;
  font-weight: 700;
}

.user-info small {
  font-size: 11px;
  color: var(--text-muted);
}

.user-actions {
  display: flex;
  gap: 8px;
}

.btn-action {
  background: var(--accent-color);
  border: none;
  color: #fff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.btn-action.add {
  background: var(--success);
  color: #000;
}
</style>

<!-- استيراد مكتبات Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.collection = collection;
  window.getDocs = getDocs;
  window.doc = doc;
  window.updateDoc = updateDoc;

  // جلب كافة المستخدمين من السحابة وعرضهم في لوحة الأدمن
  async function loadAllUsers() {
    const listContainer = document.getElementById('usersListContainer');
    listContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px;">جاري جلب الحسابات من السحابة...</div>';

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      listContainer.innerHTML = '';

      if (querySnapshot.empty) {
        listContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px;">لا يوجد مستخدمون مسجلون بعد.</div>';
        return;
      }

      querySnapshot.forEach((docSnap) => {
        const user = docSnap.data();
        const accId = docSnap.id;
        const name = user.name || 'بدون اسم';
        const balance = (user.balance || 0).toFixed(2);

        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <div class="user-info">
            <div>${name} <small>(رقم الحساب: ${accId})</small></div>
            <small style="color: var(--success); font-weight: bold;">الرصيد: $${balance}</small>
          </div>
          <div class="user-actions">
            <button class="btn-action add" onclick="modifyBalance('${accId}', ${user.balance || 0})">شحن رصيد</button>
          </div>
        `;
        listContainer.appendChild(row);
      });

    } catch (err) {
      console.error(err);
      listContainer.innerHTML = '<div style="text-align: center; color: var(--error); font-size: 12px;">خطأ في تحميل البيانات من السحابة.</div>';
    }
  }

  // دالة تعديل وشحن الرصيد لأي مستخدم
  window.modifyBalance = async function(accountNum, currentBalance) {
    const amountStr = prompt('أدخل المبلغ المراد إضافته (أو اكتب رقماً سالباً للخصم):', '100');
    if (!amountStr) return;

    const amount = parseFloat(amountStr);
    if (isNaN(amount)) {
      alert('يرجى إدخال رقم صحيح.');
      return;
    }

    try {
      const userRef = doc(db, "users", accountNum);
      const newBalance = currentBalance + amount;

      await updateDoc(userRef, {
        balance: newBalance
      });

      alert('تم تحديث رصيد الحساب ' + accountNum + ' بنجاح وأصبح: $' + newBalance.toFixed(2));
      loadAllUsers(); // إعادة تحميل القائمة فوراً
    } catch (err) {
      console.error(err);
      alert('حدث خطأ أثناء تعديل الرصيد.');
    }
  };

  window.addEventListener('DOMContentLoaded', loadAllUsers);
</script>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">لوحة تحكم الأدمن (المدير)</div>
    <button class="back-btn" onclick="location.href='dashboard.html'">العودة للرئيسية</button>
  </div>

  <div class="card-box">
    <div class="section-title">إدارة حسابات المستخدمين سحابياً</div>
    <div id="usersListContainer">
      <!-- سيتم تعبئتها تلقائياً -->
    </div>
  </div>
</div>

</body>
</html>
