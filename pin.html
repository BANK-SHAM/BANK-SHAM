<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رمز الأمان - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: all 0.2s ease;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.pin-container {
  width: 100%;
  max-width: 400px;
  text-align: center;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* أيقونة القفل الكبيرة */
.lock-icon-wrap {
  width: 90px;
  height: 90px;
  margin: 0 auto 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  color: #fff;
  filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
}

.pin-title {
  font-size: 18px;
  font-weight: 700;
  color: #f3f4f6;
  margin-bottom: 30px;
  letter-spacing: 0.5px;
}

/* مربعات إدخال الرمز الأربعة */
.pin-inputs {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 30px;
}

.pin-box {
  width: 60px;
  height: 60px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  text-align: center;
  outline: none;
  backdrop-filter: blur(10px);
}

.pin-box:focus {
  border-color: var(--accent-color);
  background: rgba(82, 120, 220, 0.1);
  box-shadow: 0 0 15px rgba(82, 120, 220, 0.3);
}

/* رابط نسيت الرمز */
.forgot-pin {
  color: var(--text-muted);
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}

.forgot-pin:hover {
  color: var(--accent-color);
}
</style>
</head>
<body>

<div class="pin-container">
  <!-- أيقونة القفل تماماً مثل الصورة -->
  <div class="lock-icon-wrap">
    🔒
  </div>

  <div class="pin-title">قم بإدخال رمز PIN</div>

  <!-- مربعات إدخال الرمز الأربعة -->
  <div class="pin-inputs">
    <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autofocus oninput="moveToNext(this, 1)">
    <input type="password" maxlength="1" class="pin-box" inputmode="numeric" oninput="moveToNext(this, 2)">
    <input type="password" maxlength="1" class="pin-box" inputmode="numeric" oninput="moveToNext(this, 3)">
    <input type="password" maxlength="1" class="pin-box" inputmode="numeric" oninput="moveToNext(this, 4)">
  </div>

  <div>
    <a href="#" class="forgot-pin" onclick="alert('سيتم إرسال تعليمات استعادة الرمز إلى بريدك')">نسيت الرمز خاصتك؟</a>
  </div>
</div>

<script>
function moveToNext(current, index) {
  if (current.value.length === 1) {
    const inputs = document.querySelectorAll('.pin-box');
    if (index < 4) {
      inputs[index].focus();
    } else {
      // عند اكتمال الأرقام الأربعة
      setTimeout(() => {
        alert('تم التحقق من الرمز بنجاح!');
        location.href = 'dashboard.html';
      }, 300);
    }
  }
}
</script>

</body>
</html>
