<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دخول الأدمن - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --error: #f87171;
  --success: #34d399;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  margin: 0; min-height: 100vh; background: var(--bg-gradient); color: var(--text-main);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.login-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  padding: 30px; border-radius: 24px; width: 100%; max-width: 400px;
  backdrop-filter: blur(15px); box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}
.title { font-size: 22px; font-weight: 900; margin-bottom: 6px; text-align: center; color: var(--accent-color); }
.subtitle { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
.form-input {
  width: 100%; background: rgba(255,255,255,0.07); border: 1px solid var(--card-border);
  padding: 12px 16px; border-radius: 12px; color: #fff; font-size: 14px; outline: none;
}
.form-input:focus { border-color: var(--accent-color); }
.submit-btn {
  width: 100%; background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none;
  color: #fff; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer;
  margin-top: 10px; box-shadow: 0 8px 20px rgba(82, 120, 220, 0.3);
}
.msg { text-align: center; font-size: 13px; margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>

<div class="login-card">
  <div class="title">بوابة الإدارة</div>
  <div class="subtitle">BANK SHAM - لوحة تحكم المشرفين</div>
  
  <form onsubmit="adminLogin(event)">
    <div class="form-group">
      <label class="form-label">البريد الإلكتروني للأدمن</label>
      <input type="email" id="adminEmail" class="form-input" placeholder="admin@banksham.com" required>
    </div>
    
    <div class="form-group">
      <label class="form-label">كلمة المرور</label>
      <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="submit-btn">تسجيل الدخول للأدمن</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<script>
  function adminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value.trim();
    const msg = document.getElementById('loginMsg');

    // يمكنك تغيير الايميل وكلمة المرور هنا بما يناسبك
    if (email === "admin@banksham.com" && password === "admin1234") {
      localStorage.setItem('bankShamAdminAuth', 'true');
      msg.style.color = 'var(--success)';
      msg.textContent = 'تم تسجيل الدخول بنجاح، جاري التحويل...';
      setTimeout(() => {
        location.href = 'admin-dashboard.html';
      }, 1000);
    } else {
      msg.style.color = 'var(--error)';
      msg.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة!';
    }
  }
</script>

</body>
</html>
