<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم الرئيسية - الأدمن</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  margin: 0; min-height: 100vh; background: var(--bg-gradient); color: var(--text-main);
  padding: 15px; display: flex; justify-content: center;
}
.container { width: 100%; max-width: 600px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 900; }
.logout-btn { background: var(--error); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; }

.section-box {
  background: var(--card-bg); border: 1px solid var(--card-border);
  padding: 15px; border-radius: 16px; margin-bottom: 15px;
}
.section-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: var(--accent-color); }
.form-input {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
  padding: 10px; border-radius: 10px; color: #fff; font-size: 13px; outline: none; margin-bottom: 8px;
}
.list-item {
  background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
  padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}
.btn-group { display: flex; gap: 5px; }
.btn-approve { background: var(--success); border: none; color: #fff; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
.btn-reject { background: var(--error); border: none; color: #fff; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
#debugBox { background: rgba(248, 113, 113, 0.1); border: 1px solid var(--error); color: var(--error); padding: 10px; border-radius: 8px; font-size: 11px; margin-bottom: 15px; display: none; }
</style>

<!-- استيراد فايربيس -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const db = getFirestore(initializeApp(firebaseConfig));
  window.depositsCache = {};

  function showError(msg) {
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    box.innerHTML += '<div>• ' + msg + '</div>';
  }

  // التحقق من تسجيل الدخول
  if (localStorage.getItem('bankShamAdminAuth') !== 'true') {
    alert('يرجى تسجيل الدخول كأدمن أولاً');
    location.href = 'admin-login.html';
  }

  window.logoutAdmin = function() {
    localStorage.removeItem('bankShamAdminAuth');
    location.href = 'admin-login.html';
  };

  async function loadAdminData() {
    const container = document.getElementById('depositsContainer');
    container.innerHTML = '<div style="color:var(--text-muted); text-align:center; font-size:12px;">جاري تحميل البيانات...</div>';

    try {
      const querySnapshot = await getDocs(collection(db, "deposits"));
      let html = '';
      let count = 0;
      window.depositsCache = {};

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        window.depositsCache[id] = data;
        count++;

        const acc = data.accountNumber || data.account || 'غير متوفر';
        const amt = data.amount || 0;

        html += `
          <div class="list-item">
            <div>
              <div style="font-weight: 800; font-size: 13px;">حساب: ${acc}</div>
              <div style="font-size: 11px; color: var(--success);">المبلغ: ${amt} USD</div>
            </div>
            <div class="btn-group">
              <button class="btn-approve" onclick="approveDeposit('${id}')">موافقة</button>
              <button class="btn-reject" onclick="rejectDeposit('${id}')">رفض</button>
            </div>
          </div>
        `;
      });

      if (count === 0) {
        html = '<div style="color:var(--text-muted); text-align:center; font-size:12px;">لا توجد طلبات إيداع معلقة.</div>';
      }
      container.innerHTML = html;

    } catch (err) {
      console.error(err);
      showError('خطأ جلب الإيداعات: ' + err.message);
      container.innerHTML = '<div style="color:var(--error); text-align:center; font-size:12px;">فشل تحميل الطلبات.</div>';
    }
  }

  window.approveDeposit = async function(id) {
    const dep = window.depositsCache[id];
    if (!dep) { alert('البيانات غير موجودة'); return; }

    const targetAcc = String(dep.accountNumber || dep.account || '').trim();
    const amount = parseFloat(dep.amount || 0);

    if (!confirm('هل تريد الموافقة على الطلب؟')) return;

    try {
      const usersSnap = await getDocs(collection(db, "users"));
      let userDocId = null;
      let currentBal = 0;

      usersSnap.forEach((uDoc) => {
        const uData = uDoc.data();
        const uAcc = String(uData.accountNumber || uData.account || uDoc.id).trim();
        if (uDoc.id === targetAcc || uAcc === targetAcc) {
          userDocId = uDoc.id;
          currentBal = parseFloat(uData.balance || 0);
        }
      });

      if (!userDocId) {
        alert('لم يتم العثور على حساب المستخدم في قاعدة البيانات!');
        return;
      }

      await updateDoc(doc(db, "users", userDocId), { balance: currentBal + amount });
      await deleteDoc(doc(db, "deposits", id));

      alert('تمت الموافقة بنجاح!');
      loadAdminData();
    } catch (err) {
      console.error(err);
      showError('خطأ الموافقة: ' + err.message);
      alert('حدث خطأ أثناء التنفيذ.');
    }
  };

  window.rejectDeposit = async function(id) {
    if (!confirm('هل تريد الرفض؟')) return;
    try {
      await deleteDoc(doc(db, "deposits", id));
      alert('تم الرفض.');
      loadAdminData();
    } catch (err) {
      showError('خطأ الرفض: ' + err.message);
    }
  };

  window.searchAccount = async function() {
    const val = document.getElementById('searchAccInput').value.trim();
    const resBox = document.getElementById('searchResultBox');
    if (!val) { resBox.innerHTML = ''; return; }

    try {
      const snap = await getDocs(collection(db, "users"));
      let found = false;
      let html = '';

      snap.forEach((d) => {
        const u = d.data();
        const acc = String(u.accountNumber || u.account || d.id);
        const name = String(u.name || u.fullName || '');

        if (acc.includes(val) || name.includes(val)) {
          found = true;
          html += `<div style="background:rgba(255,255,255,0.04); padding:8px; border-radius:8px; margin-top:5px; font-size:12px;">
            <b>الاسم:</b> ${name || 'بدون'} | <b>الحساب:</b> ${acc} | <span style="color:var(--success)"><b>الرصيد:</b> ${u.balance || 0}</span>
          </div>`;
        }
      });
      resBox.innerHTML = found ? html : '<div style="font-size:11px; color:var(--error);">لا توجد نتائج مطابقة.</div>';
    } catch (err) {
      showError('خطأ البحث: ' + err.message);
    }
  };

  window.addEventListener('DOMContentLoaded', loadAdminData);
</script>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">لوحة تحكم الأدمن</div>
    <button class="logout-btn" onclick="logoutAdmin()">تسجيل الخروج</button>
  </div>

  <div id="debugBox"></div>

  <!-- البحث -->
  <div class="section-box">
    <div class="section-title">🔍 البحث عن الحسابات</div>
    <input type="text" id="searchAccInput" class="form-input" placeholder="ابحث برقم الحساب أو الاسم..." oninput="searchAccount()">
    <div id="searchResultBox"></div>
  </div>

  <!-- الطلبات -->
  <div class="section-box">
    <div class="section-title">📥 طلبات تعبئة الرصيد المعلقة</div>
    <div id="depositsContainer"></div>
  </div>
</div>

</body>
</html>
