<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دخول الأدمن - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
  --error: #f87171;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  margin: 0; min-height: 100vh; background: var(--bg-gradient); color: var(--text-main);
  display: flex; justify-content: center; align-items: center; padding: 20px;
}
.login-card {
  width: 100%; max-width: 400px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  padding: 25px; border-radius: 20px; backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.title { font-size: 20px; font-weight: 900; margin-bottom: 6px; text-align: center; color: var(--accent-color); }
.subtitle { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--text-muted); }
.form-input {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
  padding: 12px; border-radius: 12px; color: #fff; font-size: 14px; outline: none;
}
.form-input:focus { border-color: var(--accent-color); }
.login-btn {
  width: 100%; background: var(--accent-color); border: none; color: #fff;
  padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;
  margin-top: 10px; transition: background 0.2s;
}
.login-btn:hover { background: #4364b5; }
#errorMsg { color: var(--error); font-size: 12px; text-align: center; margin-top: 12px; display: none; }
.hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 15px; line-height: 1.5; }
</style>
</head>
<body>

<div class="login-card">
  <div class="title">لوحة تحكم الأدمن</div>
  <div class="subtitle">BANK SHAM - Admin Portal</div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="label">البريد الإلكتروني</label>
      <input type="email" id="email" class="form-input" placeholder="admin@bank.com" required>
    </div>

    <div class="form-group">
      <label class="label">كلمة المرور</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="login-btn">تسجيل الدخول</button>
    <div id="errorMsg">البريد الإلكتروني أو كلمة المرور غير صحيحة!</div>
  </form>

  <div class="hint">
    البيانات الافتراضية للاختبار:<br>
    البريد: <b>ahmadkald12324@gmail.com</b><br>
    كلمة المرور: <b>1998</b>
  </div>
</div>

<script>
  function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    // تحقق من بيانات الأدمن الافتراضية (يمكنك تغييرها لاحقاً)
    if (email === 'admin@bank.com' && password === '123456') {
      // منح الصلاحية وتخزين حالة الدخول
      localStorage.setItem('bankShamAdminAuth', 'true');
      // الانتقال إلى لوحة الأدمن مباشرة مع مسار المستودع الصحيح
      location.href = 'admin-dashboard.html';
    } else {
      errorMsg.style.display = 'block';
    }
  }
</script>

</body>
</html>
