<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الإدارة - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --error: #f87171;
}
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  margin: 0; min-height: 100vh; background: var(--bg-gradient); color: var(--text-main);
  display: flex; justify-content: center; align-items: center; padding: 20px;
}
.login-card {
  width: 100%; max-width: 400px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  padding: 25px; border-radius: 20px; backdrop-filter: blur(12px);
}
.title { font-size: 20px; font-weight: 900; margin-bottom: 6px; text-align: center; color: var(--accent-color); }
.subtitle { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--text-muted); }
.form-input {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
  padding: 12px; border-radius: 12px; color: #fff; font-size: 14px; outline: none;
}
.login-btn {
  width: 100%; background: var(--accent-color); border: none; color: #fff;
  padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="title">بوابة الإدارة</div>
  <div class="subtitle">BANK SHAM - لوحة تحكم المشرفين</div>

  <form onsubmit="bypassLogin(event)">
    <div class="form-group">
      <label class="label">البريد الإلكتروني للأدمن</label>
      <input type="email" id="email" class="form-input" value="Ahmadkald1234@gmail.com" required>
    </div>

    <div class="form-group">
      <label class="label">كلمة المرور</label>
      <input type="password" id="password" class="form-input" placeholder="أدخل أي كلمة مرور" required>
    </div>

    <button type="submit" class="login-btn">دخول مباشر إلى اللوحة</button>
  </form>
</div>

<script>
  function bypassLogin(event) {
    event.preventDefault();
    // منح الصلاحية بغض النظر عن البيانات والانتقال فوراً للوحة الأدمن
    localStorage.setItem('bankShamAdminAuth', 'true');
    location.href = 'admin-dashboard.html';
  }
</script>

</body>
</html>
