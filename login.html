<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANK-SHAM | تسجيل الدخول</title>

<!-- استيراد خطوط عربية فاخرة -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family: "Tajawal", "Cairo", sans-serif;
    background:
        radial-gradient(circle at 10% 10%, rgba(37,99,235,.15), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(14,165,233,.12), transparent 40%),
        linear-gradient(135deg, #030712, #0b1120 50%, #020617);
    color:#f8fafc;
    overflow-x:hidden;
}

/* خلفية متحركة متطورة */
.background-glow{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.2;
    animation:floatGlow 10s ease-in-out infinite;
}

.glow.one{
    width:320px;
    height:320px;
    background:#2563eb;
    top:-100px;
    left:-100px;
}

.glow.two{
    width:300px;
    height:300px;
    background:#0ea5e9;
    bottom:-100px;
    right:-100px;
    animation-delay:3s;
}

@keyframes floatGlow{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(30px,-25px) scale(1.05); }
}

/* هيكل الصفحة */
.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    position:relative;
    z-index:2;
}

.login-container{
    width:100%;
    max-width:440px;
    text-align:center;
}

/* الشعار الفاخر */
.bank-logo{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.2);
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
}

.logo-symbol{
    width:54px;
    height:54px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    box-shadow: 0 0 30px rgba(59,130,246,0.6);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
}

.brand-title{
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #60a5fa, #38bdf8, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
}

.brand-subtitle{
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 28px;
    font-weight: 500;
}

/* بطاقة الدخول المصرفية */
.login-card{
    position: relative;
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 35px 30px 30px;
    box-shadow: 0 35px 90px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    overflow: hidden;
}

/* شريط ضوئي علوي متطور */
.login-card::before{
    content: "";
    position: absolute;
    top: 0;
    left: 20%;
    right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, #3b82f6, transparent);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.9);
}

.welcome{
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #fff;
}

.welcome-text{
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 28px;
}

/* الحقول */
.field{
    position: relative;
    margin-bottom: 20px;
    text-align: right;
}

.field label{
    display: block;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 600;
    margin: 0 12px 8px;
}

.input-wrapper{
    position: relative;
}

.input-wrapper input{
    width: 100%;
    height: 56px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.15);
    background: rgba(15, 23, 42, 0.6);
    color: #fff;
    outline: none;
    padding: 0 48px 0 16px;
    font-size: 15px;
    transition: all 0.3s ease;
    direction: ltr;
    text-align: left;
}

.input-wrapper input:focus{
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), 0 0 30px rgba(59, 130, 246, 0.2);
    background: rgba(15, 23, 42, 0.85);
}

.input-wrapper input::placeholder{
    color: #64748b;
}

.field-icon{
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #60a5fa;
    font-size: 16px;
    pointer-events: none;
}

/* زر إظهار كلمة المرور */
.password-toggle{
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    font-size: 16px;
}

.password-toggle:hover{
    color: #60a5fa;
    background: rgba(59, 130, 246, 0.12);
}

/* خيارات تذكرني ونسيت كلمة المرور */
.options{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 5px 4px 24px;
    font-size: 13px;
}

.remember{
    display: flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    cursor: pointer;
}

.remember input{
    width: 18px;
    height: 18px;
    accent-color: #3b82f6;
    cursor: pointer;
}

.forgot{
    color: #60a5fa;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
}

.forgot:hover{
    color: #93c5fd;
    text-decoration: underline;
}

/* زر الدخول الاحترافي */
.login-button{
    position: relative;
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #2563eb, #0284c7);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(37, 99, 235, 0.35);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
}

.login-button::before{
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    transition: 0.6s;
}

.login-button:hover::before{
    left: 140%;
}

.login-button:hover{
    box-shadow: 0 20px 45px rgba(37, 99, 235, 0.5);
    transform: translateY(-2px);
}

.login-button:active{
    transform: scale(0.98);
}

.login-button.loading{
    pointer-events: none;
    opacity: 0.85;
}

.spinner{
    width: 22px;
    height: 22px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
    margin: auto;
}

.login-button.loading .button-text{
    display: none;
}

.login-button.loading .spinner{
    display: block;
}

@keyframes spin{
    to{ transform: rotate(360deg); }
}

/* رسالة الحالة */
.status{
    min-height: 22px;
    margin-top: 15px;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.status.error{
    color: #f87171;
}

.status.success{
    color: #4ade80;
}

/* الفاصل */
.divider{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 18px;
    color: #64748b;
    font-size: 12px;
}

.divider::before,
.divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(148, 163, 184, 0.15);
}

.register{
    color: #94a3b8;
    font-size: 14px;
}

.register a{
    color: #60a5fa;
    font-weight: 700;
    text-decoration: none;
}

.register a:hover{
    text-decoration: underline;
}

.security{
    margin-top: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #64748b;
    font-size: 12px;
    font-weight: 500;
}

/* Toast Notification */
.toast{
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translate(-50%, 120px);
    min-width: 280px;
    max-width: 90%;
    padding: 14px 20px;
    border-radius: 16px;
    background: #0f172a;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    text-align: center;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 999;
}

.toast.show{
    transform: translate(-50%, 0);
    opacity: 1;
}

/* التجاوب مع الهواتف */
@media(max-width:480px){
    .login-page{ padding: 20px 15px; }
    .login-card{ padding: 28px 20px 24px; border-radius: 24px; }
    .brand-title{ font-size: 28px; }
    .welcome{ font-size: 22px; }
    .bank-logo{ width: 75px; height: 75px; }
    .logo-symbol{ width: 45px; height: 45px; font-size: 18px; }
}
</style>
</head>

<body>

<div class="background-glow">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<main class="login-page">
<div class="login-container">

    <div class="bank-logo">
        <div class="logo-symbol">BS</div>
    </div>

    <h1 class="brand-title">BANK-SHAM</h1>
    <p class="brand-subtitle">الخدمات المصرفية الرقمية الآمنة</p>

    <section class="login-card">
        <h2 class="welcome">مرحباً بعودتك</h2>
        <p class="welcome-text">سجّل الدخول للوصول إلى حسابك المصرفي</p>

        <form id="loginForm">
            
            <div class="field">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input id="email" type="email" autocomplete="email" placeholder="example@email.com" required>
                    <div class="field-icon">✉</div>
                </div>
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">👁️</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    <span>تذكرني</span>
                </label>
                <a href="#" class="forgot" id="forgotPassword">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                <span class="button-text">تسجيل الدخول</span>
                <span class="spinner"></span>
            </button>

            <div id="status" class="status"></div>

        </form>

        <div class="divider">أو</div>

        <div class="register">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </section>

    <div class="security">
        🔒 اتصال تشفير آمن ومحمي 256-bit
    </div>

</div>
</main>

<div id="toast" class="toast"></div>

<!-- Firebase Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey:"AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain:"ahmad-662ee.firebaseapp.com",
    projectId:"ahmad-662ee",
    storageBucket:"ahmad-662ee.firebasestorage.app",
    messagingSenderId:"740891153734",
    appId:"1:740891153734:web:80d3fd406214929c618147"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let audioContext = null;
function getAudioContext(){
    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioContext;
}

function clickSound(){
    try{
        const ctx = getAudioContext();
        if(ctx.state === "suspended") ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(760, ctx.currentTime + .055);
        gain.gain.setValueAtTime(.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.055, ctx.currentTime + .008);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .065);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + .07);
    }catch(e){}
}

function successSound(){
    try{
        const ctx = getAudioContext();
        if(ctx.state === "suspended") ctx.resume();
        [660, 880].forEach((frequency, index)=>{
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = frequency;
            const start = ctx.currentTime + index * .09;
            gain.gain.setValueAtTime(.0001, start);
            gain.gain.exponentialRampToValueAtTime(.07, start + .015);
            gain.gain.exponentialRampToValueAtTime(.0001, start + .16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + .17);
        });
    }catch(e){}
}

function errorSound(){
    try{
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 180;
        gain.gain.setValueAtTime(.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.06, ctx.currentTime + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .13);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + .14);
    }catch(e){}
}

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const button = document.getElementById("loginButton");
const status = document.getElementById("status");
const toast = document.getElementById("toast");
const remember = document.getElementById("rememberMe");
const togglePassword = document.getElementById("togglePassword");

function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(()=>{ toast.classList.remove("show"); }, 3000);
}

togglePassword.addEventListener("click", ()=>{
    clickSound();
    if(password.type === "password"){
        password.type = "text";
        togglePassword.textContent = "🙈";
    }else{
        password.type = "password";
        togglePassword.textContent = "👁️";
    }
});

document.querySelectorAll("button, a").forEach(element=>{
    element.addEventListener("click", ()=>{ clickSound(); });
});

form.addEventListener("submit", async(event)=>{
    event.preventDefault();
    clickSound();
    status.textContent = "";
    status.className = "status";

    const emailValue = email.value.trim();
    const passwordValue = password.value;

    if(!emailValue || !passwordValue){
        errorSound();
        status.textContent = "يرجى إدخال البريد الإلكتروني وكلمة المرور";
        status.className = "status error";
        return;
    }

    button.classList.add("loading");

    try{
        await setPersistence(auth, remember.checked ? browserLocalPersistence : browserSessionPersistence);
        await signInWithEmailAndPassword(auth, emailValue, passwordValue);

        successSound();
        status.textContent = "تم تسجيل الدخول بنجاح ✓";
        status.className = "status success";
        showToast("مرحباً بك مجدداً في BANK-SHAM");

        setTimeout(()=>{
            window.location.href = "dashboard.html";
        }, 900);

    }catch(error){
        errorSound();
        button.classList.remove("loading");
        let message = "تعذر تسجيل الدخول";

        if(error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password"){
            message = "البريد الإلكتروني أو كلمة المرور غير صحيحة";
        }else if(error.code === "auth/too-many-requests"){
            message = "تمت محاولات كثيرة، يرجى المحاولة لاحقاً";
        }else if(error.code === "auth/invalid-email"){
            message = "صيغة البريد الإلكتروني غير صحيحة";
        }

        status.textContent = message;
        status.className = "status error";
        showToast(message);
    }
});

document.getElementById("forgotPassword").addEventListener("click", async(event)=>{
    event.preventDefault();
    clickSound();
    const emailValue = email.value.trim();

    if(!emailValue){
        status.textContent = "أدخل بريدك الإلكتروني أولاً";
        status.className = "status error";
        errorSound();
        email.focus();
        return;
    }

    try{
        await sendPasswordResetEmail(auth, emailValue);
        successSound();
        status.textContent = "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك";
        status.className = "status success";
        showToast("تم إرسال رابط إعادة التعيين");
    }catch(error){
        errorSound();
        status.textContent = "تعذر إرسال رابط إعادة التعيين";
        status.className = "status error";
    }
});
</script>

</body>
</html>
