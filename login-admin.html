<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دخول المشرف</title>
<style>
body { background: #091220; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.box { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; }
button { width: 100%; padding: 12px; background: #5278dc; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div class="box">
  <h2>دخول الأدمن</h2>
  <input type="text" value="Ahmadkald1234@gmail.com" readonly>
  <input type="password" id="pass" placeholder="أدخل أي كلمة مرور">
  <button onclick="login()">دخول إلى لوحة التحكم</button>
</div>

<script>
  function login() {
    localStorage.setItem('bankShamAdminAuth', 'true');
    location.href = 'admin-dashboard.html';
  }
</script>

</body>
</html>
