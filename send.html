<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال أموال - محفظة إدلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        .page-header {
            background: #1b4332;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h2 {
            font-size: 18px;
        }
        .back-link {
            color: #d8f3dc;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .send-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2d6a4f;
        }
        .submit-btn {
            background: #2d6a4f;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        /* النافذة المنبثقة لنجاح التحويل */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            transform: scale(0.8);
            transition: 0.3s;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-icon {
            font-size: 45px;
            color: #2d6a4f;
            margin-bottom: 10px;
        }
        .modal-box h3 {
            font-size: 18px;
            color: #1b4332;
            margin-bottom: 8px;
        }
        .modal-box p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: #2d6a4f;
            color: #fff;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="page-header">
        <a href="dashboard.html" class="back-link">← لوحة التحكم</a>
        <h2>إرسال أموال</h2>
        <div style="width: 50px;"></div>
    </header>

    <div class="container">
        <div class="send-card">
            <div class="form-group">
                <label>رقم محفظة المستلم أو المعرف</label>
                <input type="text" id="recipient" placeholder="مثال: 0912345678 أو ID-8854">
            </div>
            <div class="form-group">
                <label>المبلغ المراد إرساله ($)</label>
                <input type="number" id="amount" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>ملاحظة (اختياري)</label>
                <input type="text" placeholder="ثمن بضاعة، مساعدة...">
            </div>
            <button class="submit-btn" onclick="showSuccessModal()">إتمام وتحويل المبلغ</button>
        </div>
    </div>

    <!-- نافذة النجاح المنبثقة -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="modal-icon">✅</div>
            <h3>تمت العملية بنجاح!</h3>
            <p>تم إرسال الحوالة إلى المستلم فوراً وتحديث رصيدك.</p>
            <button class="modal-btn" onclick="window.location.href='dashboard.html'">العودة لوحة التحكم</button>
        </div>
    </div>

    <script>
        function showSuccessModal() {
            const recipient = document.getElementById('recipient').value;
            const amount = document.getElementById('amount').value;

            if(!recipient || !amount) {
                alert("الرجاء إدخال رقم المستلم والمبلغ بشكل صحيح.");
                return;
            }

            // إظهار نافذة النجاح المنبثقة
            document.getElementById('successModal').classList.add('active');
        }
    </script>

</body>
</html>
