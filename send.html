<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال أموال - محفظة إدلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        /* الشريط العلوي */
        .page-header {
            background: #1b4332;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h2 {
            font-size: 18px;
        }
        .back-link {
            color: #d8f3dc;
            text-decoration: none;
            font-size: 14px;
        }

        /* حاوية النموذج */
        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .send-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #1b4332;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #2d6a4f;
        }
        
        /* صندوق الملخص والعمولات */
        .summary-box {
            background: #f8f9fa;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #555;
        }
        .summary-row.total {
            font-weight: 700;
            color: #1b4332;
            border-top: 1px solid #ddd;
            padding-top: 8px;
            margin-top: 8px;
            font-size: 16px;
        }

        /* زر التأكيد */
        .confirm-btn {
            width: 100%;
            background: #2d6a4f;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .confirm-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="page-header">
        <a href="dashboard.html" class="back-link">← لوحة التحكم</a>
        <h2>إرسال حوالة مالية</h2>
        <div style="width: 50px;"></div> <!-- لضبط التباعد -->
    </header>

    <div class="container">
        <div class="send-card">
            
            <div class="form-group">
                <label>رقم هاتف المستلم أو المعرّف</label>
                <input type="text" placeholder="مثال: 0912345678">
            </div>

            <div class="form-group">
                <label>المبلغ المراد إرساله ($)</label>
                <input type="number" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>ملاحظة للحوالة (اختياري)</label>
                <input type="text" placeholder="ثمن بضاعة، مساعدة، إلخ...">
            </div>

            <!-- ملخص الحوالة -->
            <div class="summary-box">
                <div class="summary-row">
                    <span>المبلغ الأساسي:</span>
                    <span>$0.00</span>
                </div>
                <div class="summary-row">
                    <span>رسوم التحويل (1%):</span>
                    <span>$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>المبلغ الإجمالي الخصم:</span>
                    <span>$0.00</span>
                </div>
            </div>

            <button class="confirm-btn">تأكيد وإرسال الحوالة</button>

        </div>
    </div>

</body>
</html>
