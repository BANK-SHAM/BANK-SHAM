<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السجل المالي - محفظة إدلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        .page-header {
            background: #1b4332;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h2 {
            font-size: 18px;
        }
        .back-link {
            color: #d8f3dc;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #555;
        }
        .filter-btn.active {
            background: #2d6a4f;
            color: #fff;
            border-color: #2d6a4f;
        }
        .history-list {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f4f7f6;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .h-info p {
            font-weight: 700;
            font-size: 14px;
            color: #333;
        }
        .h-info span {
            font-size: 12px;
            color: #888;
        }
        .h-amount {
            font-weight: 700;
            font-size: 15px;
        }
        .h-amount.pos { color: #2d6a4f; }
        .h-amount.neg { color: #d90429; }
    </style>
</head>
<body>

    <header class="page-header">
        <a href="dashboard.html" class="back-link">← لوحة التحكم</a>
        <h2>سجل المعاملات</h2>
        <div style="width: 50px;"></div>
    </header>

    <div class="container">
        
        <!-- أزرار التصفية -->
        <div class="filter-tabs">
            <button class="filter-btn active">الكل</button>
            <button class="filter-btn">الواردة</button>
            <button class="filter-btn">الصادرة</button>
        </div>

        <!-- قائمة العمليات -->
        <div class="history-list">
            
            <div class="history-item">
                <div class="h-info">
                    <p>تحويل إلى رامي أحمد</p>
                    <span>10 سبتمبر 2026 - 08:30 م</span>
                </div>
                <div class="h-amount neg">-$100.00</div>
            </div>

            <div class="history-item">
                <div class="h-info">
                    <p>استلام حوالة من عمر</p>
                    <span>9 سبتمبر 2026 - 02:15 م</span>
                </div>
                <div class="h-amount pos">+$350.00</div>
            </div>

            <div class="history-item">
                <div class="h-info">
                    <p>شحن رصيد عبر الوكيل</p>
                    <span>5 سبتمبر 2026 - 11:00 ص</span>
                </div>
                <div class="h-amount pos">+$500.00</div>
            </div>

        </div>

    </div>

</body>
</html>
