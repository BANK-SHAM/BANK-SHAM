<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رمز الاستجابة السريع - BANK SHAM</title>
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #091220 0%, #0d1b30 50%, #132746 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #5278dc;
  --text-main: #ffffff;
  --text-muted: #94a4b9;
  --success: #34d399;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.2s ease; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 16px 14px 90px;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.title {
  font-size: 18px;
  font-weight: 900;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.qr-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 30px 20px;
  border-radius: 24px;
  backdrop-filter: blur(10px);
  text-align: center;
  margin-bottom: 20px;
}

.qr-box {
  width: 200px;
  height: 200px;
  background: #ffffff;
  padding: 15px;
  border-radius: 16px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.qr-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.qr-name {
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 6px;
}

.qr-acc {
  font-size: 13px;
  color: var(--accent-color);
  font-weight: bold;
}

.info-text {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 10px;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 27, 48, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid var(--card-border); padding: 10px 16px 20px;
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-decoration: none;
}
.nav-item.active { color: var(--accent-color); font-weight: 700; }
.nav-item span { font-size: 18px; }
.nav-qr-btn {
  width: 50px; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, #5278dc, #3b5cb8); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; margin-top: -15px;
}
</style>

<!-- جلب بيانات المستخدم وتوليد الـ QR -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:58db6d1f6a6b57da618147",
    measurementId: "G-WY2R1ZJDPB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadQrData() {
    if (localStorage.getItem('bankShamAuth') !== 'true') {
      alert('يرجى تسجيل الدخول أولاً');
      location.href = 'index.html';
      return;
    }

    const currentAcc = localStorage.getItem('bankShamAccount');
    if (!currentAcc) {
      location.href = 'index.html';
      return;
    }

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      let foundUser = null;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        if (docId === currentAcc || data.accountNumber === currentAcc || data.account === currentAcc) {
          foundUser = data;
        }
      });

      const name = foundUser ? (foundUser.name || foundUser.fullName || 'المستخدم') : 'المستخدم';
      document.getElementById('qrName').textContent = name;
      document.getElementById('qrAccText').textContent = 'رقم الحساب: ' + currentAcc;

      // استخدام خدمة مجانية لتوليد صورة QR بناءً على رقم الحساب
      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=BANK_SHAM_ACC_${currentAcc}`;
      document.getElementById('qrImageContainer').innerHTML = `<img src="${qrImageUrl}" alt="Account QR">`;

    } catch (err) {
      console.error(err);
      document.getElementById('qrName').textContent = 'خطأ في التحميل';
    }
  }

  window.addEventListener('DOMContentLoaded', loadQrData);
</script>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">رمز الحساب (QR)</div>
    <button class="back-btn" onclick="location.href='dashboard.html'">الرئيسية</button>
  </div>

  <div class="qr-card">
    <div class="qr-box" id="qrImageContainer">
      <!-- صورة الـ QR -->
    </div>
    <div class="qr-name" id="qrName">جاري التحميل...</div>
    <div class="qr-acc" id="qrAccText">رقم الحساب: ----</div>
    <div class="info-text">اعرض هذا الكود للمرسل لتحويل الأموال لحسابك بسرعة وأمان.</div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='profile.html'">
    <span>👤</span> الملف
  </button>
  <button class="nav-item" onclick="location.href='cards.html'">
    <span>💳</span> البطاقات
  </button>
  <button class="nav-qr-btn active" onclick="location.href='qr.html'" title="رمز QR">
    📷
  </button>
  <button class="nav-item" onclick="location.href='transfer.html'">
    <span>💱</span> العمليات
  </button>
  <button class="nav-item" onclick="location.href='dashboard.html'">
    <span>🏠</span> الرئيسية
  </button>
</nav>

</body>
</html>
